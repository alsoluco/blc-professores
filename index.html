<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="BLC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>BLC · Professores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--panel:rgba(255,255,255,.035);--panel-2:rgba(255,255,255,.06);--line:rgba(255,255,255,.14);--fg:#fff;--text:rgba(255,255,255,.78);--muted:rgba(255,255,255,.58);--green:#00ff00;--cyan:#00ffff;--font:'Montserrat','Segoe UI',system-ui,-apple-system,Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(ellipse 80% 40% at 85% 0%,rgba(0,255,0,.10),transparent 70%),radial-gradient(ellipse 60% 30% at 0% 55%,rgba(0,255,255,.05),transparent 70%);background-repeat:no-repeat;color:var(--text);font-family:var(--font);font-weight:300;font-size:15px;line-height:1.65;letter-spacing:.02em;padding:0 18px 110px}
.wrap{max-width:640px;margin:0 auto;padding-top:22px;display:flex;flex-direction:column;gap:30px}
h1,h2,h3,h4{font-family:var(--font);text-transform:uppercase;margin:0;color:var(--fg);overflow-wrap:anywhere}
h1{font-weight:200;font-size:clamp(1.5rem,7vw,2.4rem);line-height:1.2;letter-spacing:.1em}
h2{font-weight:200;font-size:clamp(1.25rem,5.6vw,1.7rem);line-height:1.25;letter-spacing:.1em}
h2 em{font-style:normal;font-weight:300;color:var(--green)}
h3{font-weight:300;font-size:1.05rem;letter-spacing:.12em}
p{margin:0}
.eyebrow{font-weight:500;text-transform:uppercase;letter-spacing:.24em;font-size:.68rem;color:var(--green)}
.eyebrow.cy{color:var(--cyan)}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.brand{display:flex;align-items:center;gap:12px}
.mark{display:flex;flex-direction:column;gap:5px;width:26px}
.mark i{display:block;height:2px}.mark i:nth-child(1){background:var(--cyan)}.mark i:nth-child(2){background:var(--green)}.mark i:nth-child(3){background:#fff}
.brand b{font-weight:200;font-size:1.7rem;letter-spacing:.32em;color:var(--fg);line-height:1}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ld{position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center}
.ld .lg{position:relative;display:flex;align-items:center;gap:16px}
.ld .lg.base{opacity:.16}
.ld .lg.fill{position:absolute;inset:0;animation:ldsobe 2.4s ease-in-out infinite}
.ld .mark{width:46px;gap:9px}.ld .mark i{height:4px}
.ld .lg b{font-weight:200;font-size:2.6rem;letter-spacing:.32em;color:var(--fg);line-height:1}
@keyframes ldsobe{0%{clip-path:inset(100% 0 0 0)}80%,100%{clip-path:inset(0 0 0 0)}}
.ld p{margin:0;font-size:.8rem;text-transform:uppercase;letter-spacing:.16em;color:var(--text);min-height:1em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--font);font-weight:400;font-size:.74rem;text-transform:uppercase;letter-spacing:.16em;text-decoration:none;padding:14px 22px;border-radius:0;background:transparent;color:var(--fg);border:1px solid rgba(255,255,255,.28);cursor:pointer;line-height:1.3;text-align:center}
.btn:hover{border-color:var(--green);color:var(--green)}
.btn-green{background:var(--green);color:#000;border-color:var(--green);font-weight:600;box-shadow:0 0 28px rgba(0,255,0,.25)}
.btn-green:hover{background:#33ff33;color:#000;border-color:#33ff33}
.btn-line{border-color:var(--green);color:var(--green)}
.btn-sm{padding:9px 14px;font-size:.64rem}
.btn[disabled]{opacity:.5;cursor:default}
.card{border:1px solid var(--line);background:var(--panel);padding:18px 18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.hot{border-color:var(--green);box-shadow:0 0 24px rgba(0,255,0,.10)}
.card.cy{border-color:var(--cyan)}
label{font-weight:500;text-transform:uppercase;letter-spacing:.16em;font-size:.66rem;color:var(--cyan);display:block;margin-bottom:6px}
input[type=text],input[type=email],input[type=password],input[type=search],input[type=date],select,textarea{width:100%;font-family:var(--font);font-weight:300;font-size:16px;letter-spacing:.02em;color:var(--fg);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.22);border-radius:0;padding:13px 14px;outline:none}
textarea{min-height:220px;resize:vertical;line-height:1.55}
#tx,#nt{min-height:320px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--green) 50%),linear-gradient(135deg,var(--green) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px;background-repeat:no-repeat}
select option{background:#111;color:#fff}
input:focus,select:focus,textarea:focus{border-color:var(--cyan)}
.chk{display:flex;gap:12px;align-items:flex-start;border:1px dashed rgba(255,255,255,.28);padding:12px 14px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:#00ff00;margin-top:2px;flex:none}
.chk.on{border-color:var(--cyan);background:rgba(0,255,255,.06)}
.chk b{font-weight:500;color:var(--fg);text-transform:uppercase;letter-spacing:.1em;font-size:.76rem;display:block}
.err{border:1px solid #ff5a5a;color:#ffb3b3;padding:10px 14px;font-size:.85rem}
.ok{border:1px solid var(--green);color:var(--green);padding:10px 14px;font-size:.85rem}
.list{display:flex;flex-direction:column;gap:8px}
.pick{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);color:var(--fg);font-family:var(--font);font-size:.92rem;font-weight:300;padding:14px 16px;cursor:pointer;letter-spacing:.04em}
.pick:hover{border-color:var(--green)}
.pick span.a{color:var(--green)}
.tag{display:inline-block;font-weight:500;text-transform:uppercase;letter-spacing:.16em;font-size:.58rem;padding:3px 8px;border:1px solid var(--cyan);color:var(--cyan);white-space:nowrap}
.tag.g{border-color:var(--green);color:var(--green)}
.tag.w{border-color:#fff;color:#fff}
.kv{display:grid;grid-template-columns:1fr;gap:10px}
.kv div{min-width:0}
.kv small{display:block;font-weight:500;text-transform:uppercase;letter-spacing:.16em;font-size:.6rem;color:var(--cyan);margin-bottom:1px}
.kv span{color:var(--fg);overflow-wrap:anywhere;white-space:pre-wrap}
.kv span.none{color:rgba(255,255,255,.35)}
@media(min-width:520px){.kv.two{grid-template-columns:1fr 1fr}}
.row{display:flex;gap:10px;flex-wrap:wrap}
.hist{border-left:2px solid var(--line);padding:2px 0 2px 14px;display:flex;flex-direction:column;gap:6px}
.hist.pri{border-left-color:var(--cyan)}
.hist .meta{font-size:.74rem;color:var(--muted);letter-spacing:.06em}
.hist .txt{color:var(--fg);white-space:pre-wrap;overflow-wrap:anywhere}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{flex:1;min-width:110px}
.tabs .on{border-color:var(--green);color:var(--green)}
.back{background:none;border:0;color:var(--muted);font-family:var(--font);font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;padding:0;text-align:left}
.back:hover{color:var(--green)}
.spin{color:var(--muted);text-align:center;padding:30px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}
.dlg{background:#050505;border:1px solid var(--green);box-shadow:0 0 36px rgba(0,255,0,.18);max-width:420px;width:100%;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.dlg p{color:var(--fg);white-space:pre-line}
.msg{border-left:2px solid var(--line);padding:2px 0 8px 12px;display:flex;flex-direction:column;gap:5px}
.msg.mine{border-left-color:var(--green)}
.msg.pri{border-left-color:var(--cyan)}
.msg .meta{font-size:.74rem;color:var(--muted);letter-spacing:.05em}
.msg .txt{color:var(--fg);white-space:pre-wrap;overflow-wrap:anywhere}
.quote{border-left:2px solid var(--cyan);padding:2px 0 2px 10px;font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.chip{font-family:var(--font);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;background:transparent;color:var(--fg);border:1px solid rgba(255,255,255,.28);padding:8px 12px;cursor:pointer}
.chip.on{border-color:var(--green);color:var(--green);background:rgba(0,255,0,.07)}
.chk .small{display:block;text-transform:none;letter-spacing:.02em;font-weight:300}
.lnk{background:none;border:0;padding:4px 0;color:var(--cyan);font-family:var(--font);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.bar{height:6px;background:rgba(255,255,255,.1)}.bar i{display:block;height:100%;background:var(--green)}
#nav{position:fixed;left:0;right:0;bottom:0;display:none;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(0,0,0,.96);border-top:1px solid var(--line);z-index:40}
#nav>div{max-width:640px;margin:0 auto;display:flex;gap:8px}
#nav .btn{flex:1 1 0;min-width:0;padding:11px 6px;font-size:.6rem;letter-spacing:.12em;line-height:1.25;min-height:44px}
#nav .btn.nv-new{flex:1.4 1 0}
#nav .btn.on{border-color:var(--green);color:var(--green)}
@media(max-width:400px){#nav .btn{font-size:.54rem;letter-spacing:.07em;padding:10px 3px}}
.thread{display:flex;flex-direction:column;gap:8px}.replies{display:flex;flex-direction:column;gap:8px;margin-left:14px;padding-left:12px;border-left:2px solid var(--green)}.replies .card{padding:12px}.more{align-self:flex-start}
.rp{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ciente{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;padding:11px 14px;min-height:44px;border:1.5px solid var(--green);background:transparent;color:var(--green);font-family:var(--font);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.ciente.ok{background:var(--green);color:#000;border-color:var(--green);cursor:default}
.vis{font-size:.74rem;color:var(--muted);letter-spacing:.04em}
footer{text-align:center;color:var(--muted);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;padding-top:10px}

.brandbtn{background:none;border:0;padding:6px 0;cursor:pointer;color:inherit;font:inherit;text-align:left}
.brandbtn:focus-visible{outline:2px solid var(--cyan);outline-offset:4px}
.drw{position:fixed;inset:0;z-index:60}
.dbg{position:absolute;inset:0;background:rgba(0,0,0,.65)}
.dpn{position:absolute;top:0;bottom:0;left:0;width:min(82vw,320px);background:#000;border-right:1px solid var(--line);padding:22px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;overflow-y:auto;animation:dsl .18s ease-out}
@keyframes dsl{from{transform:translateX(-100%)}to{transform:none}}
.dit{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:1px solid var(--line);color:var(--fg);font-family:var(--font);font-weight:300;font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;padding:14px 14px;cursor:pointer;min-height:48px}
.dit.on{border-color:var(--green);color:var(--green)}
.dsec{font-weight:500;text-transform:uppercase;letter-spacing:.22em;font-size:.6rem;color:var(--muted);margin-top:10px}
.dpn .dtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.tag.r{border-color:#ff5a5a;color:#ffb3b3}
.insrow{display:flex;flex-direction:column;gap:8px}
.cvr{padding:10px 12px;gap:10px;align-items:center;justify-content:space-between}.cvr>span{flex:1;min-width:0;cursor:pointer}.cvr b{font-size:.72rem;letter-spacing:.06em;line-height:1.35;overflow-wrap:anywhere}.cvr .small{display:block;font-size:.72rem;overflow-wrap:anywhere}.zap{flex:none;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:1px solid var(--green);background:transparent;color:var(--green);padding:0;cursor:pointer}.zap:hover{background:var(--green);color:#000}
/* ---------- presença de alunos ---------- */
.pa{display:flex;flex-direction:column;gap:16px;min-width:0}
.pa-tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.pa-tot div{border:1px solid var(--line);background:var(--panel);padding:10px 14px;min-width:0}
.pa-tot b{display:block;font-size:1.6rem;font-weight:800;color:var(--green);font-variant-numeric:tabular-nums}
.pa-tot span{font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pa-tot .all b{color:var(--fg)}
.pa-mode{display:flex;gap:0;flex-wrap:wrap}
.pa-mode button{font-family:var(--font);font-weight:600;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:10px 16px;cursor:pointer;flex:1}
.pa-mode button.on{background:var(--green);color:#000;border-color:var(--green)}
.pa-tabs{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px}.pa-tabs button{flex:none}
.pa-tabs button{font-family:var(--font);font-weight:600;font-size:.7rem;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:8px 12px;cursor:pointer;text-align:left;line-height:1.4}
.pa-tabs button small{display:block;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.pa-tabs button.on{border-color:var(--green);box-shadow:inset 0 -3px 0 var(--green)}
.pa-wrap{overflow-x:auto;border:1px solid var(--line);background:var(--panel)}
.pa-wrap table{border-collapse:collapse;width:100%;min-width:620px}
.pa-wrap th,.pa-wrap td{border-bottom:1px solid var(--line);padding:9px 6px;text-align:center;font-variant-numeric:tabular-nums}
.pa-wrap th{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pa-wrap th small{display:block;font-weight:400;letter-spacing:0}
.pa-wrap th.l,.pa-wrap td.l{text-align:left;padding-left:12px}
.pa-wrap td.l{font-weight:600;font-size:.78rem}
.pa-wrap td.l small{display:block;color:var(--muted);font-size:.64rem;margin-top:2px;font-weight:400}
.pa-wrap tr.sum td{font-weight:800;border-bottom:0;background:rgba(255,255,255,.05)}
.pa-wrap .off{background:rgba(255,255,255,.05);color:var(--muted);font-size:.62rem}
.pa-wrap td.tt{border-left:2px solid var(--line)}
button.pa-n{font-family:var(--font);font-weight:800;font-size:1.05rem;min-width:42px;height:36px;padding:0 6px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;position:relative}
button.pa-n:hover{border-color:var(--green)}
button.pa-n.on{background:var(--green);color:#000;border-color:var(--green)}
button.pa-n.z{color:var(--muted);font-weight:400}
button.pa-n i{position:absolute;top:-6px;right:-6px;background:#ffb347;color:#000;font:800 .6rem var(--font);width:14px;height:14px;line-height:14px;border-radius:50%;font-style:normal}
.pa-panel{border:1px solid var(--line);background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:12px;min-height:80px;min-width:0}
.pa-panel h3{margin:0;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase}
.pa-panel h3 em{font-style:normal;color:var(--green)}
.pa-names{display:flex;flex-wrap:wrap;gap:6px}
.pa-names span{border:1px solid var(--line);padding:5px 10px;font-size:.78rem}
.pa-names span b{color:var(--green);margin-left:6px}
.pa-pass{color:#ffb347;font-size:.74rem;line-height:1.6}
.pa-pass b{letter-spacing:.08em;text-transform:uppercase;font-size:.66rem}
.pa-hint{color:var(--muted);font-size:.78rem}
.pa-rank{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 18px;font-size:.78rem;margin-top:8px}
.pa-rank div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:4px 0}
.pa-rank b{color:var(--green)}
.pa-hs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.pa-hc{border:1px solid var(--line);background:var(--panel);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pa-hc h4{margin:0;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase}
.pa-hc small{color:var(--muted);font-size:.66rem}
.pa-hc .tr{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:.72rem}
.pa-hc .tr b{font-size:.95rem}
.pa-up{color:var(--green)}.pa-dn{color:#ffb347}
svg.pa-ch{width:100%;height:auto;display:block}
svg.pa-ch rect.b{fill:var(--green);cursor:pointer}
svg.pa-ch rect.b.part{opacity:.4}
svg.pa-ch rect.b.sel{fill:var(--cyan)}
svg.pa-ch text{fill:var(--muted);font:9px var(--font)}
svg.pa-ch text.v{fill:var(--fg)}
svg.pa-ch line{stroke:var(--line)}
.pa-sw{display:flex;gap:0;margin-top:4px}
.pa-al{border:1px solid var(--line);background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pa-al.red{border-color:#ff5a5a}.pa-al.yel{border-color:#ffb347}
.pa-al .ttl{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.pa-al .ttl b{font-size:.88rem}
.pa-al .msg{border-left:2px solid var(--line);padding:4px 0 4px 12px;color:var(--text);font-size:.78rem;white-space:pre-wrap}
.pa-al .row{display:flex;gap:8px;flex-wrap:wrap}
.pa [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="spin">Carregando…</div></div>
<div id="nav"></div>
<script>
var S = { token: null, nome: '', perfil: '', email: '', atletas: [], alertas: [], tipos: [], todos: false, aba2: 'msg', fix: {}, vi: {}, limite: 40, troca: false, telaMural: false };
var API_URL = 'https://script.google.com/macros/s/AKfycbxOuRyzjdQlgKXVNYe5nawePStDPTUTBtOr4p2gD69tuUmZq8lct15tpcwomj8dAZctcw/exec';
try { var t0 = localStorage.getItem('blc_t'); if (t0) { S.token = t0; S.nome = localStorage.getItem('blc_n') || ''; S.perfil = localStorage.getItem('blc_p') || ''; S.email = localStorage.getItem('blc_e') || ''; } } catch (e) {}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function $(id) { return document.getElementById(id); }
function micOrganiza(txt) {
  var t = txt.replace(/\b(?:novo|próximo|proximo) t[óo]pico\b[.,]?/gi, '\n').replace(/^\s*[•\-]\s*/gm, '').replace(/[ \t]*\n[ \t]*/g, '\n');
  var partes = [];
  t.split('\n').forEach(function (ln) {
    ln.split(/(?<=[.!?])\s+|\s+(?=(?:aquecimento|parte principal|desaquecimento|volta à calma|observa[çc][ãa]o|observa[çc][õo]es|aten[çc][ãa]o|por fim)\b)/i).forEach(function (fr) {
      fr = fr.trim(); if (!fr) return;
      if (fr.length > 110) fr.split(/,\s+|\s+(?=(?:depois|em seguida|na sequência|aí|mas|porém)\s)/i).forEach(function (x) { x = x.trim(); if (x) partes.push(x); });
      else partes.push(fr);
    });
  });
  return partes.map(function (x) { x = x.replace(/[.,;]+$/, '').trim(); return x ? '• ' + x.charAt(0).toUpperCase() + x.slice(1) : ''; }).filter(Boolean).join('\n');
}
function micInit(id) {
  var ta = $(id); if (!ta || ta.getAttribute('data-mic')) return; ta.setAttribute('data-mic', '1');
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;

/* ---------- mural (tela inicial) ---------- */
function inicio() { mural(); }

function mural() {
  S.aba2 = 'msg'; S.atual = null; S.fix = {}; S.vi = {}; S.limite = 40; S.sigMural = '';
  app(head(userBar()) + '<div class="spin">Carregando mensagens…</div>');
  S.telaMural = true;
  carregaMural(true);
}
function carregaMural(primeira) {
  call('mural', null, !primeira).then(function (r) {
    if (!S.telaMural) return;
    S.mural = r; S.membros = r.membros;
    if (primeira) { setTimeout(pushSilencioso, 1500); abriuAviso(); }
    badgeIcone(r.paraMimTotal || 0);

    S.sigMural = sig;
    desenhaMural(primeira);
  }).catch(function (e) { if (primeira && S.token) app(head(userBar()) + '<div class="err">' + esc(e.message) + '</div><button class="btn" onclick="inicio()">Tentar de novo</button>'); });
}

/* ---------- conversas: a mensagem raiz e as respostas agrupadas ---------- */
function fios(lista) {
  var por = {}, ordem = [], idx = {};
  lista.forEach(function (m) { idx[m.id] = m; });
  function raizDe(m) {
    var n = 0;
    while (n++ < 30 && m.resposta && idx[m.resposta.id]) m = idx[m.resposta.id];
    return m.id;
  }
  lista.forEach(function (m) {
    var k = raizDe(m);
    if (!por[k]) { por[k] = { id: k, itens: [] }; ordem.push(por[k]); }
    por[k].itens.push(m);
  });
  ordem.forEach(function (t) {
    t.itens.sort(function (a, b) { return a.ts - b.ts; });
    var r = null;
    t.itens.forEach(function (m) { if (m.id === t.id) r = m; });
    t.raiz = r || t.itens[0];
    t.filhos = t.itens.filter(function (m) { return m !== t.raiz; });
    t.ts = t.itens[t.itens.length - 1].ts;
  });
  ordem.sort(function (a, b) { return b.ts - a.ts; });
  return ordem;
}
function fioHtml(t, hotFn, opts) {
  opts = opts || {};
  var topo = muralCard(t.raiz, hotFn(t.raiz), opts);
  if (!t.filhos.length) return topo;
  S.abertos = S.abertos || {};
  var f = t.filhos, vis = f, escondidas = 0;
  if (f.length > 3 && !S.abertos[t.id]) {
    vis = f.filter(function (m, i) { return i >= f.length - 3 || (m.paraMim && !S.fix[m.id]); });
    escondidas = f.length - vis.length;
  }
  var fo = { semAtleta: true, filha: true };
  return '<div class="thread">' + topo + '<div class="replies">' +
    (escondidas ? '<button class="btn btn-sm more" onclick="fioAbre(\'' + esc(t.id) + '\')">Ver todas as ' + f.length + ' respostas</button>' : '') +
    (S.abertos[t.id] && f.length > 3 ? '<button class="btn btn-sm more" onclick="fioAbre(\'' + esc(t.id) + '\')">Mostrar só as 3 últimas</button>' : '') +
    vis.map(function (m) { return muralCard(m, hotFn(m), fo); }).join('') + '</div></div>';
}
function fioAbre(id) {
  S.abertos = S.abertos || {};
  S.abertos[id] = !S.abertos[id];
  if (S.atual && S.ficha) desenhaAtleta(S.ficha); else desenhaMural();
}
function secaoMural(titulo, cls, lista, hot) {
  if (!lista.length) return '';
  return '<section><div class="eyebrow ' + cls + '" style="margin-bottom:10px">' + titulo + ' · ' + lista.length + '</div><div class="list">' +
    lista.map(function (t) { return fioHtml(t, function (m) { return hot && (m.paraMim || S.fix[m.id]); }); }).join('') + '</div></section>';
}
function desenhaMural() {
  var r = S.mural, y = window.scrollY;
  var meus = function (m) { return m.paraMim || S.fix[m.id]; };
  var ts = fios(r.itens);
  var fm = S.filtro || 'todas';
  var dirMim = function (m) { return m.email !== S.email && m.mencoes.indexOf(S.email) >= 0; };
  var dirEq = function (m) { return m.email !== S.email && !m.mencoes.length; };
  var nMim = ts.filter(function (t) { return t.itens.some(dirMim); }).length;
  var nEq = ts.filter(function (t) { return t.itens.some(dirEq); }).length;
  var naoLida = function (m) { return m.naoVi && !S.vi[m.id]; };
  var nNL = ts.filter(function (t) { return t.itens.some(naoLida); }).length;
  var nTodas = ts.length;
  if (fm === 'nl') ts = ts.filter(function (t) { return t.itens.some(naoLida); });
  if (fm === 'mim') ts = ts.filter(function (t) { return t.itens.some(dirMim); });
  if (fm === 'equipe') ts = ts.filter(function (t) { return t.itens.some(dirEq); });
  var g1 = ts.filter(function (t) { return t.itens.some(meus); });
  var g2 = ts.filter(function (t) { return g1.indexOf(t) < 0 && t.itens.some(function (m) { return m.prioridade && !m.resolvido; }); });
  var g3 = ts.filter(function (t) { return g1.indexOf(t) < 0 && g2.indexOf(t) < 0; });
  var mostra = g3.slice(0, S.limite);
  S.lookup = {};
  app(head(userBar()) + '<div><div class="eyebrow">Olá, ' + esc(S.nome.split(' ')[0]) + '</div><h2>Mensagens da <em>equipe</em></h2></div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
    [['nl', '\u2713 N\u00e3o li', nNL], ['todas', 'Todas', nTodas], ['mim', 'Direcionadas a mim', nMim], ['equipe', 'Para toda a equipe', nEq]].map(function (o) {
      return '<button class="chip' + (fm === o[0] ? ' on' : '') + '" onclick="S.filtro=\'' + o[0] + '\';desenhaMural()">' + o[1] + ' · ' + o[2] + '</button>';
    }).join('') + '</div>' +
    (fm === 'nl' ? '<div class="small muted">Conversas com mensagem sua ainda sem "Li e estou ciente". Toque no botão no fim da mensagem para ela sair daqui.</div>' : '') +
    (fm === 'mim' ? '<div class="small muted">Só as mensagens em que você foi marcado.</div>' : '') +
    (fm === 'equipe' ? '<div class="small muted">Mensagens sem ninguém marcado: valem para todos os professores.</div>' : '') +
    (fm !== 'todas' && !ts.length ? '<div class="card"><div class="muted">' + (fm === 'nl' ? 'Tudo lido. Nenhuma mensagem esperando a sua ciência.' : 'Nada por aqui por enquanto.') + '</div></div>' : '') +
    secaoMural('Para você', '', g1, true) + secaoMural('Prioridades em aberto', 'cy', g2, false) +
    (mostra.length ? '<section><div class="eyebrow" style="margin-bottom:10px">Recentes</div><div class="list">' + mostra.map(function (t) { return fioHtml(t, function () { return false; }); }).join('') + '</div>' +
      (g3.length > mostra.length ? '<button class="btn btn-sm" style="margin-top:12px" onclick="S.limite+=40;desenhaMural()">Ver mais antigas</button>' : '') + '</section>' : '') +
    (r.itens.length ? '' : '<div class="card"><div class="muted">Ainda não há mensagens. Toque em “+ Nova mensagem” para escrever a primeira.</div></div>') +
    '<footer>BLC Assessoria Esportiva · Rio de Janeiro</footer>');
  S.telaMural = true;
  window.scrollTo(0, y);
  timers.push(setInterval(function () { if (document.visibilityState === 'visible') carregaMural(false); }, 45000));
  observaVistos();
}

function muralCard(m, hot, opts) {

  S.lookup = S.lookup || {}; S.lookup[m.id] = m;
  var minha = m.email === S.email;
  var aberta = m.prioridade && !m.resolvido;
  var vis = '';
  if (m.req && m.req.length) {
    vis = '<div class="vis">' + (m.vistoPor.length ? 'Ciente: ' + m.vistoPor.map(function (v) { return esc(v.nome) + ' ' + esc(v.quando); }).join(' · ') : 'Ninguém deu ciente ainda') +
      (m.faltam.length ? ' · <span style="color:var(--cyan)">Falta dar ciente: ' + m.faltam.map(esc).join(', ') + '</span>' : '') + '</div>';
  }
  return '<div class="card' + (hot ? ' hot' : '') + (aberta && !hot ? ' cy' : '') + '" data-id="' + esc(m.id) + '"' + (m.naoVi && !S.vi[m.id] ? ' data-need="1"' : '') + '>' +
    '<div class="row" style="justify-content:space-between;align-items:center"><span class="small muted">' + esc(m.quando) + '</span><span class="tags">' +
    (m.prioridade ? '<span class="tag">Prioridade' + (m.resolvido ? ' · resolvida' : '') + '</span>' : '') + '<span class="tag' + (m.tipo === 'Atleta retornando' ? ' g' : ' w') + '">' + esc(m.tipo) + '</span></span></div>' +
    (opts.semAtleta || opts.filha ? '' : '<h3>' + esc(m.atleta) + '</h3>') + '<div class="small muted">' + esc(minha ? 'Você' : m.professor) + '</div>' +
    (opts.fichaId && m.origem === 'chat' && m.canal !== opts.fichaId && (m.atletasLista || []).some(function (a) { return a.id === opts.fichaId; }) ? '<div class="small" style="color:var(--green)">📌 Nota: ' + (m.resposta ? 'citado em resposta a ' + esc(m.resposta.professor) : 'citado em mensagem') + ' · por ' + esc(minha ? 'você' : m.professor) + '</div>' : '') +
    (m.resposta && !opts.filha ? '<div class="quote">↪ ' + esc(m.resposta.professor) + ': ' + esc(m.resposta.texto) + '</div>' : '') +
    (m.mencoes.length && m.email !== 'sistema@blc' ? '<div class="small" style="color:var(--green)">Para: ' + m.mencoes.map(function (e) { return esc(nomeEmail(e)); }).join(', ') + '</div>' : '') +
    '<div style="color:var(--fg);white-space:pre-wrap;overflow-wrap:anywhere">' + esc(m.texto) + '</div>' + vis +
    (m.resolvido ? '<div class="vis">Resolvida em ' + esc(m.resolvido.quando) + ' por ' + esc(m.resolvido.professor) + (m.resolvido.nota ? ': ' + esc(m.resolvido.nota) : '') + '</div>' : '') +
    '<div class="row"><button class="btn btn-sm btn-line" onclick="responder(\'' + esc(m.id) + '\')">Responder</button>' +
    (!opts.semAtleta && !opts.filha && m.atletaId ? '<button class="btn btn-sm' + (m.email === 'sistema@blc' ? ' btn-green' : '') + '" onclick="abrir(\'' + esc(m.atletaId) + '\')">Abrir atleta</button>' : '') +
    (!opts.semAtleta && !opts.filha && !m.atletaId && m.atletasLista && m.atletasLista.length > 1 ? m.atletasLista.map(function (a) { return '<button class="btn btn-sm" onclick="abrir(\'' + esc(a.id) + '\')">' + esc(a.nome.split(' ')[0]) + '</button>'; }).join('') : '') +
    (aberta ? '<button class="btn btn-sm" onclick="resolver(\'' + esc(m.id) + '\')">Marcar como resolvido</button>' : '') + '</div>' +

}

/* @atleta: digitar @ numa caixa de texto abre a lista de atletas; quem for escolhido é marcado na mensagem e ela vai para a ficha dele */
function ligaArroba(taId) {
  var ta = $(taId); if (!ta || ta._arr) return;
  ta._arr = {};
  var box = document.createElement('div'); box.className = 'list'; box.style.marginTop = '6px';
  ta.parentNode.insertBefore(box, ta.nextSibling);
  var dica = document.createElement('div'); dica.className = 'small muted'; dica.style.marginTop = '4px';
  dica.textContent = 'Digite @ e o nome para marcar um atleta: a mensagem também aparece na ficha dele.';
  ta.parentNode.insertBefore(dica, box);
  function garante() {
    if (S.atletasTodos) return Promise.resolve();
    return call('inicio', { todos: true }).then(function (r) { S.atletasTodos = r.atletas; S.tipos = r.tipos; });
  }
  function atualiza() {
    var antes = ta.value.slice(0, ta.selectionStart || 0);
    var m = /(^|\s)@([^\s@]*)$/.exec(antes);
    if (!m) { box.innerHTML = ''; return; }
    var q = norm(m[2]);
    garante().then(function () {
      var lista = (S.atletasTodos || []).filter(function (a) { return !q || norm(a.nome).indexOf(q) >= 0; }).slice(0, 6);
      box.innerHTML = lista.map(function (a) {
        return '<button type="button" class="pick" data-a="' + esc(a.id) + '"><span>' + esc(a.nome) + '</span><span>' + (a.status === 'Inativo' ? '<span class="tag w">Inativo</span> ' : '') + '<span class="a">@</span></span></button>';
      }).join('') || '<div class="muted small">Nenhum atleta encontrado.</div>';
      Array.prototype.forEach.call(box.querySelectorAll('.pick'), function (b) {
        b.onclick = function () {
          var id = b.getAttribute('data-a');
          var at = (S.atletasTodos || []).filter(function (x) { return x.id === id; })[0]; if (!at) return;
          var pos = ta.selectionStart || 0;
          var ini = ta.value.slice(0, pos).replace(/@[^\s@]*$/, '');
          var fim = ta.value.slice(pos);
          ta.value = ini + '@' + at.nome + ' ' + fim;
          ta._arr[id] = at.nome;
          var novo = (ini + '@' + at.nome + ' ').length;
          box.innerHTML = ''; ta.focus(); try { ta.setSelectionRange(novo, novo); } catch (e) {}
        };
      });
    }).catch(function () { box.innerHTML = ''; });
  }
  ta.addEventListener('input', atualiza);
  ta.addEventListener('click', atualiza);
  ta.addEventListener('keyup', function (e) { if (e.key && e.key.indexOf('Arrow') === 0) atualiza(); });
}
function idsArroba(taId) {
  var ta = $(taId); if (!ta || !ta._arr) return [];
  return Object.keys(ta._arr).filter(function (id) { return ta.value.indexOf('@' + ta._arr[id]) >= 0; });
}
function uniao(a, b) { var o = a.slice(); b.forEach(function (x) { if (o.indexOf(x) < 0) o.push(x); }); return o; }

/* resposta direta no próprio cartão */
function responder(id) {
  var m = (S.lookup || {})[id]; if (!m) return;
  var mesmo = S.rp && S.rp.id === id;
  if (S.rp) { var velho = $('rp_' + S.rp.id); if (velho) velho.innerHTML = ''; S.rp = null; }
  if (mesmo) return;
  S.rp = { id: id, marc: {} };
  if (m.email && m.email !== S.email) S.rp.marc[m.email] = 1;
  $('rp_' + id).innerHTML = '<div class="rp"><div class="small muted">Respondendo a ' + esc(m.professor) + '. Quem estiver marcado recebe aviso por e-mail.</div><div class="row" id="rpc"></div>' +
    '<textarea id="rpt" style="min-height:200px" placeholder="Escreva a resposta"></textarea><div id="rpm"></div>' +
    '<div class="row"><button class="btn btn-sm btn-green" id="rps" onclick="enviaResp()">Enviar resposta</button><button class="btn btn-sm" onclick="responder(\'' + esc(id) + '\')">Cancelar</button></div></div>';
  ligaChips('rpc', S.rp.marc);
  ligaArroba('rpt');
  $('rpt').focus();
}
function enviaResp() {
  var rp = S.rp; if (!rp) return;
  var m = S.lookup[rp.id]; if (!m) return;
  $('rps').disabled = true; $('rps').textContent = 'Enviando…';
  call('chatEnviar', { canal: m.canal || m.atletaId || 'GERAL', texto: $('rpt').value, respondeA: m.id, atletas: idsArroba('rpt'), mencoes: Object.keys(rp.marc), prioridade: false }).then(function () {
    S.rp = null; recarrega();
  }).catch(function (er) { $('rpm').innerHTML = '<div class="err">' + esc(er.message) + '</div>'; $('rps').disabled = false; $('rps').textContent = 'Enviar resposta'; });
}
function recarrega() { if (S.atual) abrir(S.atual); else mural(); }

function cienteBtn(m) {
  if (!m.req || m.req.indexOf(S.email) < 0) return '';
  var feito = !m.naoVi || S.vi[m.id];
  return '<button type="button" class="ciente' + (feito ? ' ok' : '') + '" id="ci_' + esc(m.id) + '"' + (feito ? ' disabled' : ' onclick="ciente(\'' + esc(m.id) + '\')"') + ' aria-pressed="' + (feito ? 'true' : 'false') + '">' +
    '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>' +
    '<span>' + (feito ? 'Ciente · você leu' : 'Li e estou ciente') + '</span></button>';
}
function ciente(id) {
  if (S.vi[id]) return;
  var b = $('ci_' + id);
  S.vi[id] = 1; S.fix[id] = 1;
  var it = (S.lookup || {})[id];
  if (it && it.paraMim && S.mural) S.mural.paraMimTotal = Math.max(0, S.mural.paraMimTotal - 1);
  if (b) { b.className = 'ciente ok'; b.disabled = true; b.removeAttribute('onclick'); b.setAttribute('aria-pressed', 'true'); b.querySelector('span').textContent = 'Ciente · você leu'; }
  desenhaNav(true);
  call('muralVisto', { ids: [id] }).catch(function () {
    S.vi[id] = 0;
    if (b) { b.className = 'ciente'; b.disabled = false; b.setAttribute('onclick', "ciente('" + id + "')"); b.setAttribute('aria-pressed', 'false'); b.querySelector('span').textContent = 'Li e estou ciente'; }
    aviso('Não consegui registrar. Confira a internet e toque de novo.');
  });
}
/* "Visto": a mensagem em que o professor foi marcado conta como vista quando aparece na tela dele */
function observaVistos() {
  return; // agora o professor confirma a ciência com o botão "Li e estou ciente"
  var els = Array.prototype.filter.call(document.querySelectorAll('[data-need="1"]'), function (e) { return !S.vi[e.getAttribute('data-id')]; });
  if (!els.length) return;
  var pend = {}, tm = null;
  function envia() {
    var ids = Object.keys(pend); pend = {}; tm = null;
    if (ids.length) call('muralVisto', { ids: ids }).catch(function () {});
  }
  function marca(id) {
    if (S.vi[id]) return;
    S.vi[id] = 1; pend[id] = 1;
    var it = (S.lookup || {})[id];
    if (it && it.paraMim) {
      S.fix[id] = 1;
      if (S.mural) S.mural.paraMimTotal = Math.max(0, S.mural.paraMimTotal - 1);
    }
    desenhaNav(true);
    if (!tm) tm = setTimeout(envia, 1200);
  }
  if (!('IntersectionObserver' in window)) { els.forEach(function (e) { marca(e.getAttribute('data-id')); }); return; }
  var io = new IntersectionObserver(function (es) {
    es.forEach(function (en) {
      if (en.isIntersecting && document.visibilityState === 'visible') { io.unobserve(en.target); marca(en.target.getAttribute('data-id')); }
    });
  }, { threshold: 0.25 });
  els.forEach(function (e) { io.observe(e); });
}

function norm(s) { return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
function lista() {

  var fl = S.filtro || 'ativos';
  var l = S.atletas.filter(function (a) { return (fl === 'todos' || (fl === 'inativos') === (a.status === 'Inativo')) && (!q || norm(a.nome).indexOf(q) >= 0); });
  var tot = l.length;
  l = l.slice(0, 40);
  $('res').innerHTML = (l.map(function (a) {
    return '<button class="pick" onclick="abrir(\'' + esc(a.id) + '\')"><span>' + esc(a.nome) + '</span><span>' +

function iaSalvaCred() {

function iaLiga(on) { call('iaConfig', { on: on }).then(function () { aviso('IA ' + (on ? 'ligada' : 'desligada') + '.'); iaTela(); }).catch(function (e) { aviso(e.message); }); }

function finProvaDoResumo(id) { S.finDe = 'resumo'; finProva(id); }
function finVoltar() { if (S.finDe === 'resumo') { S.finDe = ''; painelAsaas(AS.mes, true); } else finProvas(); }
function finResumo(r, pv, pd, ex, todos) {
  var mesOk = !todos && r.tot && r.tot.recebido;
  var rec = mesOk ? r.tot.recebido.valor : 0, noPrazo = mesOk ? r.tot.areceber.valor : 0, venc = r.tot && r.tot.atraso ? r.tot.atraso.valor : 0;
  var aberto = null, reserva = null, abertas = [], reservas = []; S.pvResumo = pv ? pv.provas : [];
  if (pv) {
    aberto = 0; reserva = 0;
    pv.provas.forEach(function (x) {
      if (x.quitada) { reserva += x.emCaixa || 0; if ((x.emCaixa || 0) > 0.004) reservas.push(x); }
      else if ((x.emCaixa || 0) > 0.004) { aberto += x.emCaixa; abertas.push(x); }
    });
    aberto = Math.round(aberto * 100) / 100; reserva = Math.round(reserva * 100) / 100;
  }
  var prod = null;
  if (pd) { prod = 0; pd.grupos.forEach(function (g) { if (g.reserva || /^Outros avulsos/.test(g.produto)) return; g.itens.forEach(function (i) { if (i.g === 'recebido' && String(i.pagoEm || i.venc).slice(0, 7) === AS.mes) prod += i.valor; }); }); prod = Math.round(prod * 100) / 100; }
  var sem = ex ? ex.semCobranca.valor : 0;
  var sep = (aberto !== null ? aberto + reserva : 0) + (prod || 0);
  var livre = (typeof r.saldo === 'number' && aberto !== null) ? Math.round((r.saldo - sep) * 100) / 100 : null;
  var h = '<div class="card"><div class="eyebrow">Resumo financeiro · ' + esc(asMesNome(AS.mes)) + '</div>';
  if (mesOk) h += finLinha('Já recebido no mês', rec, 'g') + finLinha('A receber, ainda no prazo', noPrazo, 'w') + finLinha('Mensalidades vencidas (últimos 90 dias, todos os meses)', venc, venc ? 'r' : '') +
    '<div class="row" style="gap:6px;flex-wrap:wrap;margin:4px 0 6px"><button class="btn btn-sm" onclick="asVerVencidas(false)">Ver quem venceu em ' + esc(asMesNome(AS.mes)) + '</button><button class="btn btn-sm" onclick="asVerVencidas(true)">Ver todas dos últimos 90 dias</button></div>';
  else h += finLinha('Mensalidades vencidas (últimos 90 dias, qualquer mês)', venc, venc ? 'r' : '') + '<div class="row" style="gap:6px;flex-wrap:wrap;margin:4px 0 6px"><button class="btn btn-sm" onclick="asVerVencidas(false)">Ver só as do mês</button><button class="btn btn-sm" onclick="asVerVencidas(true)">Ver todas dos últimos 90 dias</button></div><div class="small muted">Escolha "Por mês" para ver recebido e a receber no prazo.</div>';
  h += '<hr style="border:0;border-top:1px solid rgba(128,128,128,.3);margin:10px 0">';
  if (aberto !== null) {
    h += finLinha('Separar para pagar provas e eventos (recebido, ainda sem baixa)', aberto, 'w') +
      (abertas.length ? finChips(abertas, 'Toque no nome para abrir a prova, ou em Dar baixa se você já fez a transferência ao organizador', false) : '<div class="small muted">Todas as provas estão com baixa dada.</div>') +
      (reserva ? finLinha('Reserva da BLC já retida nas inscrições (tenda e camisa)', reserva, 'w') + finChips(reservas, 'Toque no nome para abrir a prova, ou em Dar baixa se você já retirou a reserva', true) : '');
  } else h += '<div class="small muted">Provas: não consegui calcular agora.</div>';
  if (prod !== null) h += finLinha('Separar para produtos (vendas recebidas no mês)', prod, 'w');
  h += '<hr style="border:0;border-top:1px solid rgba(128,128,128,.3);margin:10px 0">' +
    finLinha('Saldo na conta Asaas agora', r.saldo === null || r.saldo === undefined ? '' : r.saldo, 'g');
  if (livre !== null) h += finLinha('Saldo livre (saldo − o que está separado)', livre, livre < 0 ? 'r' : 'g');
  if (typeof r.saldo === 'number') h += '<hr style="border:0;border-top:1px solid rgba(128,128,128,.3);margin:10px 0">' + finLinha('TOTAL: saldo no Asaas + tudo que falta receber' + (mesOk ? ' (no prazo + vencidas)' : ' (vencidas)'), Math.round((r.saldo + noPrazo + venc) * 100) / 100, 'g') +
    '<div class="small muted">' + finMoeda(r.saldo) + ' no Asaas + ' + finMoeda(noPrazo + venc) + ' a receber</div>';
  if (mesOk && ex) h += '<hr style="border:0;border-top:1px solid rgba(128,128,128,.3);margin:10px 0">' +
    finLinha('Renovações ainda sem cobrança no mês', sem, '') +
    finLinha('Total previsto no mês, se todos os ativos renovarem', Math.round((rec + noPrazo + venc + sem) * 100) / 100, 'w') +
    '<div class="small muted">' + ex.ativas.qtd + ' assinatura(s) ativa(s) · valor mensal das ativas ' + finMoeda(ex.ativas.valorMensal) + '</div>';

  }

    '<div class="card"><div><label for="pn">Nome (ex.: Camisa Team 2026 – azul)</label><input id="pn" type="text" value="' + esc(p.nome) + '"></div>' +
    '<div style="margin-top:12px"><label for="pp">Preço (R$)</label><input id="pp" type="text" inputmode="decimal" value="' + esc(p.preco === '' ? '' : String(p.preco).replace('.', ',')) + '"></div>' +
    '<div style="margin-top:12px"><label for="pg">Tamanhos e estoque</label><input id="pg" type="text" value="' + esc(g) + '" placeholder="P=10; M=8; G=5; GG=2"><div class="small muted" style="margin-top:6px">Use o formato tamanho=quantidade, separados por ponto e vírgula. Ao editar, os números são o estoque atual.</div></div>' +
    (id ? '<div style="margin-top:12px"><label for="pa">Situação</label><select id="pa"><option value="1"' + (p.ativo ? ' selected' : '') + '>Ativo (aparece nas vendas)</option><option value="0"' + (p.ativo ? '' : ' selected') + '>Inativo</option></select></div>' : '') +
    '<div class="row" style="margin-top:14px;gap:8px;flex-wrap:wrap"><button class="btn btn-green" onclick="salvaProd(\'' + esc(id || '') + '\')">Salvar</button><button class="btn" onclick="painelProd()">Cancelar</button>' + (id ? '<button class="btn" onclick="apagaProd(\'' + esc(id) + '\')">Apagar produto</button>' : '') + '</div></div>');
}
function salvaProd(id) {
  call('prodSalvar', { id: id, nome: $('pn').value, preco: $('pp').value, grade: $('pg').value, ativo: $('pa') ? $('pa').value === '1' : true })
    .then(function () { painelProd(); }).catch(function (e) { aviso(e.message); });
}
function formVenda() {
  PR.atletaSel = null;
  var ativos = PR.produtos.filter(function (p) { return p.ativo; });
  if (!ativos.length) { aviso('Cadastre um produto primeiro.'); return; }
  var go = function () {
    app(prCab() + '<div><div class="eyebrow">' + (ehAdm() ? 'Head coach' : 'Professor') + '</div><h2>Nova <em>venda</em></h2></div><div class="card">' +
      '<div><label for="vp">Produto</label><select id="vp" onchange="vendaProd()">' + ativos.map(function (p) { return '<option value="' + esc(p.id) + '">' + esc(p.nome) + ' · ' + finMoeda(p.preco) + '</option>'; }).join('') + '</select></div>' +
      '<div style="margin-top:12px"><label for="vt">Tamanho</label><select id="vt" onchange="vendaTot()"></select></div>' +
      '<div style="margin-top:12px"><label for="vq">Quantidade</label><input id="vq" type="text" inputmode="numeric" value="1" oninput="vendaTot()"></div>' +
      '<div style="margin-top:12px"><label for="va">Atleta</label><input id="va" type="search" placeholder="Digite o nome do atleta" oninput="vendaBusca(this.value)"><div id="vsel" class="small" style="margin-top:6px"></div><div id="vres" class="list"></div></div>' +
      '<div style="margin-top:12px"><label for="ve">Entrega</label><select id="ve" onchange="vendaEnt()"><option value="0">Retirar na tenda da BLC (sem taxa)</option><option value="1">Receber em casa (+ ' + finMoeda(PR.taxa) + ')</option></select></div>' +
      '<div id="vend" style="margin-top:12px;display:none"><label for="vad">Endereço de entrega</label><input id="vad" type="text" placeholder="Rua, número, complemento, bairro"></div>' +
      '<div style="margin-top:12px"><label for="vo">Observação (opcional)</label><input id="vo" type="text"></div>' +
      '<div id="vtot" class="small" style="margin-top:12px"></div>' +
      '<div class="row" style="margin-top:14px;gap:8px"><button class="btn btn-green" onclick="vendaOk()">Registrar venda</button><button class="btn" onclick="painelProd()">Cancelar</button></div></div>');
    vendaProd();
  };
  if (PR.atl) go(); else call('inicio', { todos: false }).then(function (r) { PR.atl = r.atletas; go(); }).catch(function (e) { aviso(e.message); });
}
function vendaProdSel() { return PR.produtos.filter(function (x) { return x.id === $('vp').value; })[0]; }
function vendaProd() {
  var p = vendaProdSel();
  $('vt').innerHTML = p.grade.map(function (x) { return '<option value="' + esc(x.t) + '"' + (x.q < 1 ? ' disabled' : '') + '>' + esc(x.t) + ' (' + x.q + ' em estoque)</option>'; }).join('');
  vendaTot();
}
function vendaEnt() { $('vend').style.display = $('ve').value === '1' ? 'block' : 'none'; vendaTot(); }
function vendaTotal() {
  var p = vendaProdSel(), q = parseInt($('vq').value, 10) || 0;
  return Math.round((p.preco * q + ($('ve') && $('ve').value === '1' ? PR.taxa : 0)) * 100) / 100;
}
function vendaTot() {
  var q = parseInt($('vq').value, 10) || 0, ent = $('ve') && $('ve').value === '1';
  $('vtot').innerHTML = q > 0 ? 'Total: <b>' + finMoeda(vendaTotal()) + '</b>' + (ent ? ' <span class="muted">(inclui taxa de entrega de ' + finMoeda(PR.taxa) + ')</span>' : '') : '';
}
function vendaLista() {
  var l = (PR.atl || []).slice();
  if (ehAdm() && S.email) l.unshift({ id: 'PROF:' + S.email, nome: String(S.nome || 'Beto').replace(/\s*\(.*?\)\s*/g, ' ').trim() + ' (teste)' });
  return l;
}
function vendaBusca(v) {
  var q = norm(v);
  $('vres').innerHTML = q.length < 2 ? '' : vendaLista().filter(function (a) { return norm(a.nome).indexOf(q) >= 0; }).slice(0, 6).map(function (a) {
    return '<button type="button" class="pick" onclick="vendaAtl(\'' + esc(a.id) + '\')"><span>' + esc(a.nome) + '</span></button>';
  }).join('') || '<div class="muted small">Nenhum atleta encontrado.</div>';
}
function vendaAtl(id) {
  var a = vendaLista().filter(function (x) { return x.id === id; })[0]; if (!a) return;
  PR.atletaSel = a; $('vres').innerHTML = ''; $('va').value = a.nome; $('vsel').innerHTML = 'Atleta escolhido: <b>' + esc(a.nome) + '</b>';
}
function vendaOk() {
  if (!PR.atletaSel) { aviso('Escolha o atleta na lista que aparece ao digitar o nome.'); return; }
  var p = vendaProdSel(), q = parseInt($('vq').value, 10) || 0, t = $('vt').value, obs = $('vo').value, at = PR.atletaSel;
  var ent = $('ve').value === '1', endr = $('vad').value;
  if (ent && String(endr).trim().length < 8) { aviso('Digite o endereço de entrega.'); return; }
  var tot = finMoeda(vendaTotal());
  var resumo = q + '× ' + p.nome + ' (tam. ' + t + ') para ' + at.nome + ' por ' + tot + (ent ? ', com entrega em casa' : ', retirada na tenda');
  carrega('Conferindo o cadastro no Asaas...');
  call('vendaPreparar', { atletaId: at.id }).then(function (r) {
    carregaFim();
    if (r.achou) {
      return dlg('Registrar a venda de ' + resumo + '? Será criada uma cobrança no Asaas (cliente: ' + r.clienteNome + ')' + (r.temEmail ? ' e o link vai por e-mail ao atleta.' : '. Atenção: o atleta não tem e-mail cadastrado, então o e-mail não será enviado.'), { ok: 'Registrar e cobrar' })
        .then(function (sim) { return sim ? { criarCliente: false } : null; });
    }
    if (!ehAdm()) { aviso(at.nome + ' ainda não está cadastrado(a) no Asaas. Peça ao head coach para cadastrar antes de vender.'); return null; }
    return dlg(at.nome + ' não está cadastrado(a) no Asaas. Para criar a cobrança, preciso cadastrar o cliente lá. Você autoriza? Digite o CPF do atleta e toque em Autorizar.', { ok: 'Autorizar e cadastrar', input: 'CPF (somente números)' })
      .then(function (cpf) { return cpf ? { criarCliente: true, cpf: cpf } : null; });
  }).then(function (extra) {
    if (!extra) return;
    carrega('Gerando a cobrança e enviando os e-mails...');
    return call('vendaRegistrar', { produtoId: p.id, tamanho: t, qtd: q, atletaId: at.id, obs: obs, entrega: ent, endereco: endr, criarCliente: extra.criarCliente, cpf: extra.cpf }).then(function (r) { carregaFim(); vendaFeita(r, at.nome); });
  }).catch(function (e) { carregaFim(); aviso(e.message); });
}
function zapLink(tel, texto) { return 'https://wa.me/' + tel + '?text=' + encodeURIComponent(texto); }
function vendaFeita(r, nome) {
  PR.ult = r;
  app(prCab() + '<div><div class="eyebrow">Venda registrada</div><h2>Cobrança <em>criada</em></h2></div><div class="card">' +
    '<div class="small"><b>' + esc(nome) + '</b> · ' + finMoeda(r.total) + '</div>' +
    '<div class="small muted" style="margin-top:6px">E-mail: ' + esc(r.email === 'enviado' ? 'enviado ao atleta' : r.email) + '</div>' +
    '<div class="small muted">Estoque restante deste tamanho: ' + r.restante + '</div>' +
    '<div class="small" style="margin-top:8px;word-break:break-all">Link: ' + esc(r.link) + '</div>' +
    '<div class="row" style="margin-top:14px;gap:8px;flex-wrap:wrap">' +
    (r.tel ? '<button class="btn btn-green" onclick="window.open(zapLink(PR.ult.tel, PR.ult.texto), \'_blank\')">Enviar no WhatsApp</button>' : '<div class="small muted">Atleta sem telefone cadastrado: copie o link e envie manualmente.</div>') +
    '<button class="btn" onclick="painelProd()">Concluir</button></div></div>');
}
function vendaZap(id) {
  var v = PR.vendas.filter(function (x) { return x.id === id; })[0];
  if (!v || !v.texto) return;
  if (!v.tel) { aviso('Este atleta não tem telefone cadastrado. Link: ' + v.link); return; }
  window.open(zapLink(v.tel, v.texto), '_blank');
}
function apagaProd(id) {
  dlg('Apagar este produto? Só é possível se ele não tiver vendas.', { ok: 'Apagar' }).then(function (sim) {
    if (!sim) return;
    call('prodApagar', { id: id }).then(function () { painelProd(); }).catch(function (e) { aviso(e.message); });
  });
}
function vendaCancela(id) {
  dlg('Cancelar esta venda? A cobrança no Asaas será cancelada e as peças voltam para o estoque.', { ok: 'Cancelar venda' }).then(function (sim) {
    if (!sim) return;
    carrega('Cancelando a cobrança e avisando por e-mail...');
    call('vendaCancelar', { id: id }).then(function (r) { carregaFim(); painelProd(); if (r.email && r.email !== 'enviado') aviso('Venda cancelada. O e-mail ao atleta não foi enviado (' + r.email + '). Avise-o por WhatsApp.'); }).catch(function (e) { carregaFim(); aviso(e.message); });
  });
}
function verPainel() { S.aba2 = 'pnl'; painel('hist'); }

function painel(aba) {
  S.aba = aba; S.aba2 = 'pnl';
  if (aba === 'eng') { painelEng(); return; }
  if (aba === 'pres') { painelPres(); return; }
  if (aba === 'fin') { painelFin(); return; }
  var tabs = painelTabs(aba);
  if (aba === 'prof') {
    app(head(userBar()) + '<button class="back" onclick="inicio()">← Mensagens</button><div><div class="eyebrow">Head coach</div><h2>Painel</h2></div>' + tabs + '<div class="spin">Carregando…</div>');
    call('professores').then(function (r) {
      app(head(userBar()) + '<button class="back" onclick="inicio()">← Mensagens</button><div><div class="eyebrow">Head coach</div><h2>Painel</h2></div>' + tabs +
        '<div class="list">' + r.lista.map(function (p) {
          return '<div class="card"><div class="row" style="justify-content:space-between;align-items:center"><h3>' + esc(p.nome) + '</h3>' + (p.ativo ? '<span class="tag g">Ativo</span>' : '<span class="tag w">Desativado</span>') + '</div>' +
            '<div class="small muted">' + esc(p.email) + ' · ' + esc(p.perfil) + '</div>' +
            '<div class="small muted">Último acesso: ' + (esc(p.acesso) || 'nunca') + (p.trocar ? ' · aguardando troca de senha' : '') + '</div>' +
            '<div class="row"><button class="btn btn-sm" onclick="ativaProf(\'' + esc(p.email) + '\',' + (!p.ativo) + ')">' + (p.ativo ? 'Desativar' : 'Reativar') + '</button>' +
            '<button class="btn btn-sm btn-line" onclick="resetProf(\'' + esc(p.email) + '\')">Resetar senha</button></div></div>';
        }).join('') + '</div>' +
        '<form class="card hot" id="np"><div class="eyebrow">Novo professor</div><div id="nm"></div><div><label for="pn">Nome</label><input id="pn" type="text"></div><div><label for="pe">E-mail</label><input id="pe" type="email"></div>' +
        '<button class="btn btn-green" type="submit">Cadastrar</button><p class="small muted">Senha inicial: 123456. No primeiro acesso o professor cria a própria senha.</p></form>');
      $('np').onsubmit = function (e) {
        e.preventDefault();
        call('novoProfessor', { nome: $('pn').value, email: $('pe').value }).then(function () { painel('prof'); }).catch(function (er) { $('nm').innerHTML = '<div class="err">' + esc(er.message) + '</div>'; });
      };
    }).catch(function (e) { aviso(e.message); });
    return;
  }
  app(head(userBar()) + '<button class="back" onclick="inicio()">← Mensagens</button><div><div class="eyebrow">Head coach</div><h2>Painel</h2></div>' + tabs +
    '<form class="card" id="fh"><div><label for="hp">Professor (e-mail)</label><input id="hp" type="text" placeholder="todos"></div>' +
    '<div><label for="ha">Atleta</label><input id="ha" type="text" placeholder="todos"></div>' +
    '<div class="row"><div style="flex:1;min-width:130px"><label for="hd">De</label><input id="hd" type="date"></div><div style="flex:1;min-width:130px"><label for="hu">Até</label><input id="hu" type="date"></div></div>' +
    '<label class="chk" style="margin:0"><input type="checkbox" id="hx"><span class="small">Só prioridades</span></label>' +
    '<button class="btn btn-green" type="submit">Filtrar</button></form><div id="hr"><div class="spin">Carregando…</div></div>');
  $('fh').onsubmit = function (e) { e.preventDefault(); carregaHist(); };
  carregaHist();
}
function carregaHist() {
  $('hr').innerHTML = '<div class="spin">Carregando…</div>';
  call('historico', { professor: $('hp').value.trim(), atleta: $('ha').value.trim(), de: $('hd').value, ate: $('hu').value, soPrioridade: $('hx').checked }).then(function (r) {
    $('hr').innerHTML = '<div class="card"><div class="eyebrow">' + r.total + ' registro(s)' + (r.total > 300 ? ' · mostrando os 300 mais recentes' : '') + '</div>' +
      (r.itens.length ? r.itens.map(function (h) { return histItem(h, true); }).join('') : '<div class="muted small">Nada encontrado.</div>') + '</div>';
  }).catch(function (e) { $('hr').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
}
function ativaProf(email, ativo) { call('ativarProfessor', { email: email, ativo: ativo }).then(function () { painel('prof'); }).catch(function (e) { aviso(e.message); }); }
function resetProf(email) {
  dlg('Resetar a senha deste professor para 123456? Ele terá de criar uma nova no próximo acesso.', { ok: 'Resetar' }).then(function (sim) {
    if (!sim) return;
    call('resetarSenha', { email: email }).then(function () { painel('prof'); return aviso('Senha resetada para 123456.'); }).catch(function (e) { aviso(e.message); });
  });
}

var ABRIU_T = 0;
function abriuAviso() { if (!S.token || Date.now() - ABRIU_T < 300000) return; ABRIU_T = Date.now(); call('abriu').catch(function () {}); }
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState !== 'visible' || !S.token) return;
  if (S.telaMural) carregaMural(false); abriuAviso();
});
if (S.token) inicio(); else telaLogin();
if ('serviceWorker' in navigator) {
  var teveSW = !!navigator.serviceWorker.controller, jaRecarregou = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () { if (teveSW && !jaRecarregou) { jaRecarregou = true; location.reload(); } });
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').then(function (reg) { try { reg.update(); } catch (e) {} }).catch(function () {}); });
}
</script>
</body>
</html>
