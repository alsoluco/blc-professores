<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="BLC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>BLC · Professores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--panel:rgba(255,255,255,.035);--panel-2:rgba(255,255,255,.06);--line:rgba(255,255,255,.14);--fg:#fff;--text:rgba(255,255,255,.78);--muted:rgba(255,255,255,.58);--green:#00ff00;--cyan:#00ffff;--font:'Montserrat','Segoe UI',system-ui,-apple-system,Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(ellipse 80% 40% at 85% 0%,rgba(0,255,0,.10),transparent 70%),radial-gradient(ellipse 60% 30% at 0% 55%,rgba(0,255,255,.05),transparent 70%);background-repeat:no-repeat;color:var(--text);font-family:var(--font);font-weight:300;font-size:15px;line-height:1.65;letter-spacing:.02em;padding:0 18px 110px}
.wrap{max-width:640px;margin:0 auto;padding-top:22px;display:flex;flex-direction:column;gap:30px}
h1,h2,h3,h4{font-family:var(--font);text-transform:uppercase;margin:0;color:var(--fg);overflow-wrap:anywhere}
h1{font-weight:200;font-size:clamp(1.5rem,7vw,2.4rem);line-height:1.2;letter-spacing:.1em}
h2{font-weight:200;font-size:clamp(1.25rem,5.6vw,1.7rem);line-height:1.25;letter-spacing:.1em}
h2 em{font-style:normal;font-weight:300;color:var(--green)}
h3{font-weight:300;font-size:1.05rem;letter-spacing:.12em}
p{margin:0}
.eyebrow{font-weight:500;text-transform:uppercase;letter-spacing:.24em;font-size:.68rem;color:var(--green)}
.eyebrow.cy{color:var(--cyan)}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.brand{display:flex;align-items:center;gap:12px}
.mark{display:flex;flex-direction:column;gap:5px;width:26px}
.mark i{display:block;height:2px}.mark i:nth-child(1){background:var(--cyan)}.mark i:nth-child(2){background:var(--green)}.mark i:nth-child(3){background:#fff}
.brand b{font-weight:200;font-size:1.7rem;letter-spacing:.32em;color:var(--fg);line-height:1}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--font);font-weight:400;font-size:.74rem;text-transform:uppercase;letter-spacing:.16em;text-decoration:none;padding:14px 22px;border-radius:0;background:transparent;color:var(--fg);border:1px solid rgba(255,255,255,.28);cursor:pointer;line-height:1.3;text-align:center}
.btn:hover{border-color:var(--green);color:var(--green)}
.btn-green{background:var(--green);color:#000;border-color:var(--green);font-weight:600;box-shadow:0 0 28px rgba(0,255,0,.25)}
.btn-green:hover{background:#33ff33;color:#000;border-color:#33ff33}
.btn-line{border-color:var(--green);color:var(--green)}
.btn-sm{padding:9px 14px;font-size:.64rem}
.btn[disabled]{opacity:.5;cursor:default}
.card{border:1px solid var(--line);background:var(--panel);padding:18px 18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.hot{border-color:var(--green);box-shadow:0 0 24px rgba(0,255,0,.10)}
.card.cy{border-color:var(--cyan)}
label{font-weight:500;text-transform:uppercase;letter-spacing:.16em;font-size:.66rem;color:var(--cyan);display:block;margin-bottom:6px}
input[type=text],input[type=email],input[type=password],input[type=search],input[type=date],select,textarea{width:100%;font-family:var(--font);font-weight:300;font-size:16px;letter-spacing:.02em;color:var(--fg);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.22);border-radius:0;padding:13px 14px;outline:none}
textarea{min-height:120px;resize:vertical;line-height:1.55}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--green) 50%),linear-gradient(135deg,var(--green) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px;background-repeat:no-repeat}
select option{background:#111;color:#fff}
input:focus,select:focus,textarea:focus{border-color:var(--cyan)}
.chk{display:flex;gap:12px;align-items:flex-start;border:1px dashed rgba(255,255,255,.28);padding:12px 14px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:#00ff00;margin-top:2px;flex:none}
.chk.on{border-color:var(--cyan);background:rgba(0,255,255,.06)}
.chk b{font-weight:500;color:var(--fg);text-transform:uppercase;letter-spacing:.1em;font-size:.76rem;display:block}
.err{border:1px solid #ff5a5a;color:#ffb3b3;padding:10px 14px;font-size:.85rem}
.ok{border:1px solid var(--green);color:var(--green);padding:10px 14px;font-size:.85rem}
.list{display:flex;flex-direction:column;gap:8px}
.pick{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);color:var(--fg);font-family:var(--font);font-size:.92rem;font-weight:300;padding:14px 16px;cursor:pointer;letter-spacing:.04em}
.pick:hover{border-color:var(--green)}
.pick span.a{color:var(--green)}
.tag{display:inline-block;font-weight:500;text-transform:uppercase;letter-spacing:.16em;font-size:.58rem;padding:3px 8px;border:1px solid var(--cyan);color:var(--cyan);white-space:nowrap}
.tag.g{border-color:var(--green);color:var(--green)}
.tag.w{border-color:#fff;color:#fff}
.kv{display:grid;grid-template-columns:1fr;gap:10px}
.kv div{min-width:0}
.kv small{display:block;font-weight:500;text-transform:uppercase;letter-spacing:.16em;font-size:.6rem;color:var(--cyan);margin-bottom:1px}
.kv span{color:var(--fg);overflow-wrap:anywhere;white-space:pre-wrap}
.kv span.none{color:rgba(255,255,255,.35)}
@media(min-width:520px){.kv.two{grid-template-columns:1fr 1fr}}
.row{display:flex;gap:10px;flex-wrap:wrap}
.hist{border-left:2px solid var(--line);padding:2px 0 2px 14px;display:flex;flex-direction:column;gap:6px}
.hist.pri{border-left-color:var(--cyan)}
.hist .meta{font-size:.74rem;color:var(--muted);letter-spacing:.06em}
.hist .txt{color:var(--fg);white-space:pre-wrap;overflow-wrap:anywhere}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{flex:1;min-width:110px}
.tabs .on{border-color:var(--green);color:var(--green)}
.back{background:none;border:0;color:var(--muted);font-family:var(--font);font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;padding:0;text-align:left}
.back:hover{color:var(--green)}
.spin{color:var(--muted);text-align:center;padding:30px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}
.dlg{background:#050505;border:1px solid var(--green);box-shadow:0 0 36px rgba(0,255,0,.18);max-width:420px;width:100%;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.dlg p{color:var(--fg)}
.msg{border-left:2px solid var(--line);padding:2px 0 8px 12px;display:flex;flex-direction:column;gap:5px}
.msg.mine{border-left-color:var(--green)}
.msg.pri{border-left-color:var(--cyan)}
.msg .meta{font-size:.74rem;color:var(--muted);letter-spacing:.05em}
.msg .txt{color:var(--fg);white-space:pre-wrap;overflow-wrap:anywhere}
.quote{border-left:2px solid var(--cyan);padding:2px 0 2px 10px;font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.chip{font-family:var(--font);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;background:transparent;color:var(--fg);border:1px solid rgba(255,255,255,.28);padding:8px 12px;cursor:pointer}
.chip.on{border-color:var(--green);color:var(--green);background:rgba(0,255,0,.07)}
.chk .small{display:block;text-transform:none;letter-spacing:.02em;font-weight:300}
.lnk{background:none;border:0;padding:4px 0;color:var(--cyan);font-family:var(--font);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.bar{height:6px;background:rgba(255,255,255,.1)}.bar i{display:block;height:100%;background:var(--green)}
#nav{position:fixed;left:0;right:0;bottom:0;display:none;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(0,0,0,.96);border-top:1px solid var(--line);z-index:40}
#nav>div{max-width:640px;margin:0 auto;display:flex;gap:8px}
#nav .btn{flex:1 1 0;min-width:0;padding:11px 6px;font-size:.6rem;letter-spacing:.12em;line-height:1.25;min-height:44px}
#nav .btn.nv-new{flex:1.4 1 0}
#nav .btn.on{border-color:var(--green);color:var(--green)}
@media(max-width:400px){#nav .btn{font-size:.54rem;letter-spacing:.07em;padding:10px 3px}}
.thread{display:flex;flex-direction:column;gap:8px}.replies{display:flex;flex-direction:column;gap:8px;margin-left:14px;padding-left:12px;border-left:2px solid var(--green)}.replies .card{padding:12px}.more{align-self:flex-start}
.rp{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.vis{font-size:.74rem;color:var(--muted);letter-spacing:.04em}
footer{text-align:center;color:var(--muted);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;padding-top:10px}

.brandbtn{background:none;border:0;padding:6px 0;cursor:pointer;color:inherit;font:inherit;text-align:left}
.brandbtn:focus-visible{outline:2px solid var(--cyan);outline-offset:4px}
.drw{position:fixed;inset:0;z-index:60}
.dbg{position:absolute;inset:0;background:rgba(0,0,0,.65)}
.dpn{position:absolute;top:0;bottom:0;left:0;width:min(82vw,320px);background:#000;border-right:1px solid var(--line);padding:22px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;overflow-y:auto;animation:dsl .18s ease-out}
@keyframes dsl{from{transform:translateX(-100%)}to{transform:none}}
.dit{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:1px solid var(--line);color:var(--fg);font-family:var(--font);font-weight:300;font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;padding:14px 14px;cursor:pointer;min-height:48px}
.dit.on{border-color:var(--green);color:var(--green)}
.dsec{font-weight:500;text-transform:uppercase;letter-spacing:.22em;font-size:.6rem;color:var(--muted);margin-top:10px}
.dpn .dtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.tag.r{border-color:#ff5a5a;color:#ffb3b3}
.insrow{display:flex;flex-direction:column;gap:8px}
.cvr{padding:10px 12px;gap:10px;align-items:center;justify-content:space-between}.cvr>span{flex:1;min-width:0;cursor:pointer}.cvr b{font-size:.72rem;letter-spacing:.06em;line-height:1.35;overflow-wrap:anywhere}.cvr .small{display:block;font-size:.72rem;overflow-wrap:anywhere}.zap{flex:none;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:1px solid var(--green);background:transparent;color:var(--green);padding:0;cursor:pointer}.zap:hover{background:var(--green);color:#000}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="spin">Carregando…</div></div>
<div id="nav"></div>
<script>
var S = { token: null, nome: '', perfil: '', email: '', atletas: [], alertas: [], tipos: [], todos: false, aba2: 'msg', fix: {}, vi: {}, limite: 40, troca: false, telaMural: false };
var API_URL = 'https://script.google.com/macros/s/AKfycbxOuRyzjdQlgKXVNYe5nawePStDPTUTBtOr4p2gD69tuUmZq8lct15tpcwomj8dAZctcw/exec';
try { var t0 = localStorage.getItem('blc_t'); if (t0) { S.token = t0; S.nome = localStorage.getItem('blc_n') || ''; S.perfil = localStorage.getItem('blc_p') || ''; S.email = localStorage.getItem('blc_e') || ''; } } catch (e) {}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function $(id) { return document.getElementById(id); }
var timers = [];
function pararTimers() { timers.forEach(clearInterval); timers = []; }
function app(html, semNav) { pararTimers(); S.telaMural = false; S.rp = null; $('app').innerHTML = html; window.scrollTo(0, 0); desenhaNav(!semNav && !!S.token && !S.troca); }
function desenhaNav(on) {
  var n = $('nav'); if (n) n.style.display = 'none';
  if (on && S.provas === undefined && !S.provasCarregando) carregaProvas();
}
function carregaProvas(depois) {
  S.provasCarregando = true;
  call('provas').then(function (r) { S.provas = r.provas || []; S.provasCarregando = false; if (depois) depois(); })
    .catch(function () { S.provasCarregando = false; if (S.provas === undefined) S.provas = []; if (depois) depois(); });
}

/* ---------- menu lateral ---------- */
function menuAbre() {
  if ($('drw')) return;
  if (S.provas === undefined) carregaProvas(menuAtualiza);
  var o = document.createElement('div'); o.id = 'drw'; o.className = 'drw';
  document.body.appendChild(o);
  menuAtualiza();
}
function menuFecha() { var o = $('drw'); if (o) document.body.removeChild(o); }
function menuAtualiza() {
  var o = $('drw'); if (!o) return;
  function it(txt, fn, on, extra) { return '<button type="button" class="dit' + (on ? ' on' : '') + '" onclick="menuFecha();' + fn + '"><span>' + txt + '</span>' + (extra || '') + '</button>'; }
  var pv = S.provas || [];
  var provas = pv.length
    ? '<div class="dsec">Inscritos em provas</div>' + pv.map(function (p) { return it(esc(p.nome) + ' · ' + esc(String(p.data).slice(0, 5)), "inscritos('" + esc(p.id) + "')", S.aba2 === 'prova' + p.id); }).join('')
    : '<div class="dsec">Inscritos em provas</div><div class="small muted">' + (S.provas === undefined ? 'Carregando…' : 'Nenhuma prova aberta.') + '</div>';
  o.innerHTML = '<div class="dbg" onclick="menuFecha()"></div><nav class="dpn" aria-label="Menu">' +
    '<div class="dtop"><div class="brand"><div class="mark"><i></i><i></i><i></i></div><b>BLC</b></div><button type="button" class="btn btn-sm" onclick="menuFecha()" aria-label="Fechar menu">Fechar</button></div>' +
    it('Mensagens', 'mural()', S.aba2 === 'msg', badge(S.mural ? S.mural.paraMimTotal : 0)) +
    it('Atletas', 'atletas()', S.aba2 === 'atl') +
    '<button type="button" class="btn btn-green" onclick="menuFecha();novaMsg()">+ Nova mensagem</button>' +
    provas +
    (S.perfil === 'Admin' ? '<div class="dsec">Head coach</div>' + it('Painel', 'verPainel()', S.aba2 === 'pnl') : '') +
    '<div class="dsec">Conta</div><div class="small muted">' + esc(S.nome) + '</div>' + it('Sair', 'sair()', false) +
    '</nav>';
}

function dlg(msg, opts) {
  opts = opts || {};
  return new Promise(function (resolve) {
    var o = document.createElement('div');
    o.className = 'ov';
    o.innerHTML = '<div class="dlg"><p>' + esc(msg) + '</p>' + (opts.input ? '<input id="dlgi" type="text" placeholder="' + esc(opts.input) + '">' : '') +
      '<div class="row">' + (opts.cancel === false ? '' : '<button class="btn btn-sm" id="dlgn">Cancelar</button>') + '<button class="btn btn-sm btn-green" id="dlgy">' + esc(opts.ok || 'OK') + '</button></div></div>';
    document.body.appendChild(o);
    function fim(v) { document.body.removeChild(o); resolve(v); }
    o.querySelector('#dlgy').onclick = function () { fim(opts.input ? o.querySelector('#dlgi').value : true); };
    if (o.querySelector('#dlgn')) o.querySelector('#dlgn').onclick = function () { fim(opts.input ? null : false); };
  });
}
function aviso(msg) { return dlg(msg, { cancel: false }); }

function call(action, payload) {
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ a: action, t: S.token, p: payload || {} }), redirect: 'follow' })
    .then(function (resp) { return resp.text(); })
    .then(function (txt) {
      var r; try { r = JSON.parse(txt); } catch (e) { throw new Error('Resposta inválida do servidor.'); }
      if (!r.ok) {
        if (r.erro === 'SESSAO') { sair(true); throw new Error('Sessão expirada. Entre de novo.'); }
        throw new Error(r.erro || 'Erro.');
      }
      return r;
    }, function () { throw new Error('Sem conexão com o servidor. Verifique a internet e tente de novo.'); });
}

function head(right) {
  var logado = !!S.token && !S.troca;
  var marca = '<div class="mark"><i></i><i></i><i></i></div><b>BLC</b>';
  return '<div class="top">' + (logado ? '<button type="button" class="brand brandbtn" onclick="menuAbre()" aria-label="Abrir menu">' + marca + '</button>' : '<div class="brand">' + marca + '</div>') + (right || '') + '</div>';
}
function userBar() {
  return '<div class="who"><span class="small muted">' + esc(S.nome) + '</span><button class="btn btn-sm" onclick="sair()">Sair</button></div>';
}

/* ---------- login ---------- */
function telaLogin(msg) {
  app(head() +
    '<div><div class="eyebrow">Comunicação interna</div><h1>Professores <em style="font-style:normal;color:var(--green)">BLC</em></h1></div>' +
    '<form class="card" id="f" autocomplete="on">' +
    (msg ? '<div class="err">' + esc(msg) + '</div>' : '') +
    '<div><label for="em">E-mail</label><input id="em" type="email" autocomplete="username" inputmode="email" required></div>' +
    '<div><label for="pw">Senha</label><input id="pw" type="password" autocomplete="current-password" required></div>' +
    '<button class="btn btn-green" id="bt" type="submit">Entrar</button>' +
    '<button type="button" class="lnk" onclick="telaEsqueci()">Esqueci minha senha</button></form>' +
    '<footer>BLC Assessoria Esportiva · Rio de Janeiro</footer>');
  $('f').onsubmit = function (e) {
    e.preventDefault();
    $('bt').disabled = true; $('bt').textContent = 'Entrando…';
    call('login', { email: $('em').value, senha: $('pw').value }).then(function (r) {
      S.token = r.token; S.nome = r.nome; S.perfil = r.perfil; S.email = String($('em').value).trim().toLowerCase();
      try { localStorage.setItem('blc_t', r.token); localStorage.setItem('blc_n', r.nome); localStorage.setItem('blc_p', r.perfil); localStorage.setItem('blc_e', S.email); } catch (e) {}
      if (r.trocarSenha) telaTroca(); else inicio();
    }).catch(function (er) { telaLogin(er.message); });
  };
}

function telaEsqueci(msg, ok) {
  app(head() +
    '<div><div class="eyebrow">Senha</div><h2>Esqueci minha <em>senha</em></h2><p class="muted" style="margin-top:8px">Digite o e-mail cadastrado. Enviamos uma senha temporária para ele, e no próximo acesso você cria uma senha nova.</p></div>' +
    '<form class="card" id="f">' + (msg ? '<div class="' + (ok ? 'ok' : 'err') + '">' + esc(msg) + '</div>' : '') +
    '<div><label for="em">E-mail</label><input id="em" type="email" autocomplete="username" inputmode="email" required></div>' +
    '<button class="btn btn-green" id="bt" type="submit">Enviar senha temporária</button>' +
    '<button type="button" class="lnk" onclick="telaLogin()">← Voltar ao login</button></form>');
  $('f').onsubmit = function (e) {
    e.preventDefault();
    $('bt').disabled = true; $('bt').textContent = 'Enviando…';
    call('esqueci', { email: $('em').value }).then(function (r) { telaEsqueci(r.msg, true); }).catch(function (er) { telaEsqueci(er.message); });
  };
}

function telaTroca(msg) {
  S.troca = true;
  app(head() +
    '<div><div class="eyebrow">Primeiro acesso</div><h2>Crie a sua <em>senha</em></h2><p class="muted" style="margin-top:8px">A senha padrão só vale uma vez. Escolha uma senha que só você saiba (mínimo 6 caracteres).</p></div>' +
    '<form class="card" id="f">' + (msg ? '<div class="err">' + esc(msg) + '</div>' : '') +
    '<div><label for="n1">Nova senha</label><input id="n1" type="password" autocomplete="new-password" required></div>' +
    '<div><label for="n2">Repita a nova senha</label><input id="n2" type="password" autocomplete="new-password" required></div>' +
    '<button class="btn btn-green" id="bt" type="submit">Salvar senha</button></form>');
  $('f').onsubmit = function (e) {
    e.preventDefault();
    if ($('n1').value !== $('n2').value) { telaTroca('As senhas não conferem.'); return; }
    $('bt').disabled = true;
    call('trocarSenha', { nova: $('n1').value }).then(function () { S.troca = false; inicio(); }).catch(function (er) { telaTroca(er.message); });
  };
}

function sair(silencioso) {
  if (S.token && !silencioso) { try { call('logout'); } catch (e) {} }
  S.token = null; S.nome = ''; S.perfil = ''; S.email = ''; S.troca = false; S.mural = null;

/* ---------- conversas: a mensagem raiz e as respostas agrupadas ---------- */
function fios(lista) {
  var por = {}, ordem = [], idx = {};
  lista.forEach(function (m) { idx[m.id] = m; });
  function raizDe(m) {
    var n = 0;
    while (n++ < 30 && m.resposta && idx[m.resposta.id]) m = idx[m.resposta.id];
    return m.id;
  }
  lista.forEach(function (m) {
    var k = raizDe(m);
    if (!por[k]) { por[k] = { id: k, itens: [] }; ordem.push(por[k]); }
    por[k].itens.push(m);
  });
  ordem.forEach(function (t) {
    t.itens.sort(function (a, b) { return a.ts - b.ts; });
    var r = null;
    t.itens.forEach(function (m) { if (m.id === t.id) r = m; });
    t.raiz = r || t.itens[0];
    t.filhos = t.itens.filter(function (m) { return m !== t.raiz; });
    t.ts = t.itens[t.itens.length - 1].ts;
  });
  ordem.sort(function (a, b) { return b.ts - a.ts; });
  return ordem;
}
function fioHtml(t, hotFn, opts) {
  opts = opts || {};
  var topo = muralCard(t.raiz, hotFn(t.raiz), opts);
  if (!t.filhos.length) return topo;
  S.abertos = S.abertos || {};
  var f = t.filhos, vis = f, escondidas = 0;
  if (f.length > 3 && !S.abertos[t.id]) {
    vis = f.filter(function (m, i) { return i >= f.length - 3 || (m.paraMim && !S.fix[m.id]); });
    escondidas = f.length - vis.length;
  }
  var fo = { semAtleta: true, filha: true };
  return '<div class="thread">' + topo + '<div class="replies">' +
    (escondidas ? '<button class="btn btn-sm more" onclick="fioAbre(\'' + esc(t.id) + '\')">Ver todas as ' + f.length + ' respostas</button>' : '') +
    (S.abertos[t.id] && f.length > 3 ? '<button class="btn btn-sm more" onclick="fioAbre(\'' + esc(t.id) + '\')">Mostrar só as 3 últimas</button>' : '') +
    vis.map(function (m) { return muralCard(m, hotFn(m), fo); }).join('') + '</div></div>';
}
function fioAbre(id) {
  S.abertos = S.abertos || {};
  S.abertos[id] = !S.abertos[id];
  if (S.atual && S.ficha) desenhaAtleta(S.ficha); else desenhaMural();
}
function secaoMural(titulo, cls, lista, hot) {
  if (!lista.length) return '';
  return '<section><div class="eyebrow ' + cls + '" style="margin-bottom:10px">' + titulo + ' · ' + lista.length + '</div><div class="list">' +
    lista.map(function (t) { return fioHtml(t, function (m) { return hot && (m.paraMim || S.fix[m.id]); }); }).join('') + '</div></section>';
}
function desenhaMural() {
  var r = S.mural, y = window.scrollY;
  var meus = function (m) { return m.paraMim || S.fix[m.id]; };
  var ts = fios(r.itens);
  var fm = S.filtro || 'todas';
  var dirMim = function (m) { return m.email !== S.email && m.mencoes.indexOf(S.email) >= 0; };
  var dirEq = function (m) { return m.email !== S.email && !m.mencoes.length; };
  var nMim = ts.filter(function (t) { return t.itens.some(dirMim); }).length;
  var nEq = ts.filter(function (t) { return t.itens.some(dirEq); }).length;
  var nTodas = ts.length;
  if (fm === 'mim') ts = ts.filter(function (t) { return t.itens.some(dirMim); });
  if (fm === 'equipe') ts = ts.filter(function (t) { return t.itens.some(dirEq); });
  var g1 = ts.filter(function (t) { return t.itens.some(meus); });
  var g2 = ts.filter(function (t) { return g1.indexOf(t) < 0 && t.itens.some(function (m) { return m.prioridade && !m.resolvido; }); });
  var g3 = ts.filter(function (t) { return g1.indexOf(t) < 0 && g2.indexOf(t) < 0; });
  var mostra = g3.slice(0, S.limite);
  S.lookup = {};
  app(head(userBar()) + '<div><div class="eyebrow">Olá, ' + esc(S.nome.split(' ')[0]) + '</div><h2>Mensagens da <em>equipe</em></h2></div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
    [['todas', 'Todas', nTodas], ['mim', 'Direcionadas a mim', nMim], ['equipe', 'Para toda a equipe', nEq]].map(function (o) {
      return '<button class="chip' + (fm === o[0] ? ' on' : '') + '" onclick="S.filtro=\'' + o[0] + '\';desenhaMural()">' + o[1] + ' · ' + o[2] + '</button>';
    }).join('') + '</div>' +
    (fm === 'mim' ? '<div class="small muted">Só as mensagens em que você foi marcado.</div>' : '') +
    (fm === 'equipe' ? '<div class="small muted">Mensagens sem ninguém marcado: valem para todos os professores.</div>' : '') +
    (fm !== 'todas' && !ts.length ? '<div class="card"><div class="muted">Nada por aqui por enquanto.</div></div>' : '') +
    secaoMural('Para você', '', g1, true) + secaoMural('Prioridades em aberto', 'cy', g2, false) +
    (mostra.length ? '<section><div class="eyebrow" style="margin-bottom:10px">Recentes</div><div class="list">' + mostra.map(function (t) { return fioHtml(t, function () { return false; }); }).join('') + '</div>' +
      (g3.length > mostra.length ? '<button class="btn btn-sm" style="margin-top:12px" onclick="S.limite+=40;desenhaMural()">Ver mais antigas</button>' : '') + '</section>' : '') +
    (r.itens.length ? '' : '<div class="card"><div class="muted">Ainda não há mensagens. Toque em “+ Nova mensagem” para escrever a primeira.</div></div>') +
    '<footer>BLC Assessoria Esportiva · Rio de Janeiro</footer>');
  S.telaMural = true;
  window.scrollTo(0, y);
  timers.push(setInterval(function () { if (document.visibilityState === 'visible') carregaMural(false); }, 45000));
  observaVistos();
}

function muralCard(m, hot, opts) {
  opts = opts || {};
  S.lookup = S.lookup || {}; S.lookup[m.id] = m;
  var minha = m.email === S.email;
  var aberta = m.prioridade && !m.resolvido;

  if (m.req && m.req.length) {

      (m.faltam.length ? ' · <span style="color:var(--cyan)">Ainda não viu: ' + m.faltam.map(esc).join(', ') + '</span>' : '') + '</div>';
  }
  return '<div class="card' + (hot ? ' hot' : '') + (aberta && !hot ? ' cy' : '') + '" data-id="' + esc(m.id) + '"' + (m.naoVi && !S.vi[m.id] ? ' data-need="1"' : '') + '>' +

    (opts.semAtleta || opts.filha ? '' : '<h3>' + esc(m.atleta) + '</h3>') + '<div class="small muted">' + esc(minha ? 'Você' : m.professor) + '</div>' +
    (m.resposta && !opts.filha ? '<div class="quote">↪ ' + esc(m.resposta.professor) + ': ' + esc(m.resposta.texto) + '</div>' : '') +
    (m.mencoes.length && m.email !== 'sistema@blc' ? '<div class="small" style="color:var(--green)">Para: ' + m.mencoes.map(function (e) { return esc(nomeEmail(e)); }).join(', ') + '</div>' : '') +
    '<div style="color:var(--fg);white-space:pre-wrap;overflow-wrap:anywhere">' + esc(m.texto) + '</div>' + vis +
    (m.resolvido ? '<div class="vis">Resolvida em ' + esc(m.resolvido.quando) + ' por ' + esc(m.resolvido.professor) + (m.resolvido.nota ? ': ' + esc(m.resolvido.nota) : '') + '</div>' : '') +
    '<div class="row"><button class="btn btn-sm btn-line" onclick="responder(\'' + esc(m.id) + '\')">Responder</button>' +
    (!opts.semAtleta && !opts.filha && m.atletaId ? '<button class="btn btn-sm' + (m.email === 'sistema@blc' ? ' btn-green' : '') + '" onclick="abrir(\'' + esc(m.atletaId) + '\')">Abrir atleta</button>' : '') +
    (!opts.semAtleta && !opts.filha && !m.atletaId && m.atletasLista && m.atletasLista.length > 1 ? m.atletasLista.map(function (a) { return '<button class="btn btn-sm" onclick="abrir(\'' + esc(a.id) + '\')">' + esc(a.nome.split(' ')[0]) + '</button>'; }).join('') : '') +
    (aberta ? '<button class="btn btn-sm" onclick="resolver(\'' + esc(m.id) + '\')">Marcar como resolvido</button>' : '') + '</div>' +
    '<div id="rp_' + esc(m.id) + '"></div></div>';
}

/* resposta direta no próprio cartão */
function responder(id) {
  var m = (S.lookup || {})[id]; if (!m) return;

  ligaChips('rpc', S.rp.marc);

}
function enviaResp() {
  var rp = S.rp; if (!rp) return;
  var m = S.lookup[rp.id]; if (!m) return;
  $('rps').disabled = true; $('rps').textContent = 'Enviando…';
  call('chatEnviar', { canal: m.canal || m.atletaId || 'GERAL', texto: $('rpt').value, respondeA: m.id, mencoes: Object.keys(rp.marc), prioridade: false }).then(function () {
    S.rp = null; recarrega();
  }).catch(function (er) { $('rpm').innerHTML = '<div class="err">' + esc(er.message) + '</div>'; $('rps').disabled = false; $('rps').textContent = 'Enviar resposta'; });
}
function recarrega() { if (S.atual) abrir(S.atual); else mural(); }

/* "Visto": a mensagem em que o professor foi marcado conta como vista quando aparece na tela dele */
function observaVistos() {
  var els = Array.prototype.filter.call(document.querySelectorAll('[data-need="1"]'), function (e) { return !S.vi[e.getAttribute('data-id')]; });
  if (!els.length) return;
  var pend = {}, tm = null;
  function envia() {
    var ids = Object.keys(pend); pend = {}; tm = null;
    if (ids.length) call('muralVisto', { ids: ids }).catch(function () {});
  }
  function marca(id) {
    if (S.vi[id]) return;
    S.vi[id] = 1; pend[id] = 1;
    var it = (S.lookup || {})[id];
    if (it && it.paraMim) {
      S.fix[id] = 1;
      if (S.mural) S.mural.paraMimTotal = Math.max(0, S.mural.paraMimTotal - 1);
    }
    desenhaNav(true);
    if (!tm) tm = setTimeout(envia, 1200);
  }
  if (!('IntersectionObserver' in window)) { els.forEach(function (e) { marca(e.getAttribute('data-id')); }); return; }
  var io = new IntersectionObserver(function (es) {
    es.forEach(function (en) {
      if (en.isIntersecting && document.visibilityState === 'visible') { io.unobserve(en.target); marca(en.target.getAttribute('data-id')); }
    });
  }, { threshold: 0.25 });
  els.forEach(function (e) { io.observe(e); });
}

/* ---------- presença dos professores (só head coach) ---------- */
function dataBr(iso) { var p = String(iso).split('-'); return p[2] + '/' + p[1]; }
/* Índice de envolvimento: pesos e metas (a soma dos pesos é 100). Ajuste aqui se quiser mudar a conta. */
var PESO = { comp: 30, pont: 30, leit: 10, esc: 20, acc: 20 };
var META_ESC_SEMANA = 2;   // mensagens/registros escritos por semana = 100% de escrita
var META_ACESSO_SEMANA = 3; // abrir o app em pelo menos 3 dias por semana = 100% de acesso
var BANDAS = [[80, 'Muito bom', 'g'], [60, 'Bom', 'g'], [40, 'Precisa melhorar', ''], [0, 'Atenção', 'w']];
var PV = { de: '', ate: '', sel: null, d: null, envs: [] };
function lim01(x) { return Math.max(0, Math.min(1, x)); }
function banda(n) { for (var i = 0; i < BANDAS.length; i++) if (n >= BANDAS[i][0]) return BANDAS[i]; return BANDAS[3]; }
function indiceEnv(pr, ev, dias) {
  var c = [];
  if (pr && pr.previstos) {
    c.push({ k: 'Comparecimento', p: PESO.comp, v: pr.registrados / pr.previstos });
    c.push({ k: 'Pontualidade', p: PESO.pont, v: pr.registrados ? pr.no_horario / pr.registrados : null });
  }
  c.push({ k: 'Leitura', p: PESO.leit, v: ev.devidas ? ev.vistas / ev.devidas : null });
  c.push({ k: 'Escrita', p: PESO.esc, v: lim01(ev.escritas / (META_ESC_SEMANA * dias / 7)) });
  c.push({ k: 'Acesso ao app', p: PESO.acc, v: lim01(ev.diasAbriu / (META_ACESSO_SEMANA * dias / 7)) });
  var soma = 0, tot = 0;
  c.forEach(function (x) { if (x.v !== null) { soma += x.p * x.v; tot += x.p; } });
  return { nota: tot ? Math.round(100 * soma / tot) : null, comp: c, tot: tot };
}
/* Recalcula a presença do professor só com os dias do período escolhido. Atraso = minutos que passaram da tolerância. */
function atrasoEf(x, ref) { return x.atraso; }
function limHora(ref, tol) { var b = ref.split(':'), t = +b[0] * 60 + +b[1] + tol; return ('0' + Math.floor(t / 60)).slice(-2) + ':' + ('0' + (t % 60)).slice(-2); }
function presPeriodo(pr) {
  var out = { previstos: 0, registrados: 0, no_horario: 0, exc: 0, locais: [] };
  pr.locais.forEach(function (l) {
    var tol = l.tol_min || PV.d.tolerancia_min;
    var dias = l.dias.filter(function (x) { return x.data >= PV.de && x.data <= PV.ate; });
    var reg = dias.filter(function (x) { return !x.sem_dado; });
    var nh = reg.filter(function (x) { return atrasoEf(x, l.ref) <= tol; }).length;
    var exc = reg.reduce(function (a, x) { return a + Math.max(0, atrasoEf(x, l.ref) - tol); }, 0);
    var at = reg.reduce(function (a, x) { return a + x.ativo; }, 0);
    out.locais.push({ l: l, tol: tol, dias: dias, previstos: dias.length, registrados: reg.length, no_horario: nh, exc: exc, ativo: reg.length ? at / reg.length : null });
    out.previstos += dias.length; out.registrados += reg.length; out.no_horario += nh; out.exc += exc;
  });

}
function feedbackEnv(ag, ev, dias, ix) {

  if (c['Comparecimento'] != null) add(c['Comparecimento'], 'Esteve em ' + ag.registrados + ' de ' + ag.previstos + ' treinos previstos (' + pc(c['Comparecimento']) + ').',

  if (c['Pontualidade'] != null) {

  }
  if (c['Leitura'] != null) add(c['Leitura'], 'Leu ' + ev.vistas + ' de ' + ev.devidas + ' mensagens da equipe (' + pc(c['Leitura']) + ').', ' Dá para melhorar.', ' Abrir o mural todo dia evita deixar prioridades paradas.');
  add(c['Escrita'], 'Escreveu ' + ev.escritas + ' registro(s); a meta do período é ' + Math.max(1, Math.round(META_ESC_SEMANA * dias / 7)) + '.', ' Dá para escrever um pouco mais.',
    ' Registrar o que observa nos treinos e nos atletas ajuda os colegas e o histórico.');
  add(c['Acesso ao app'], 'Abriu o app em ' + ev.diasAbriu + ' de ' + dias + ' dias (meta: ' + Math.max(1, Math.round(META_ACESSO_SEMANA * dias / 7)) + ', ou seja, ' + META_ACESSO_SEMANA + ' por semana).', ' Dá para abrir com mais frequência.',
    ' Abrir o app todo dia, antes ou depois do treino, mantém tudo em dia.');
  if (ev.medianaMin !== null && ev.medianaMin !== undefined) {
    if (ev.medianaMin <= 240) f.push({ s: 'bom', t: 'Costuma ver as mensagens em ' + minTxt(ev.medianaMin) + '.' });

  return { itens: f, resumo: resumo };
}

    (fone ? '<button type="button" class="zap" aria-label="Enviar pelo WhatsApp" title="WhatsApp" onclick="cvZap(\'' + esc(a.id) + '\')"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg></button>' : '') + '</div>';
}
function cvLista() {
  var q = cvNorm($('cvq') ? $('cvq').value : '').trim(), todos = S.cv.atletas;
  var res = q ? todos.filter(function (a) { return cvNorm(a.nome).indexOf(q) >= 0; }) : (S.cvAll ? todos : []);
  var total = res.length;
  res = res.slice(0, 40);
  $('cvres').innerHTML = res.map(cvLinha).join('') + (total > 40 ? '<div class="muted small">Mostrando 40 de ' + total + '. Digite mais letras para filtrar.</div>' : '') ||
    '<div class="muted small">' + (q ? 'Nenhum atleta encontrado (ou ele já se inscreveu).' : (todos.length ? 'Digite o nome para buscar.' : 'Todos os atletas ativos já se inscreveram.')) + '</div>';
  var ids = Object.keys(S.cvSel);
  $('cvsn').textContent = 'Selecionados: ' + ids.length;
  $('cvsel').innerHTML = ids.map(function (id) { var a = cvAtl(id); return a ? cvLinha(a) : ''; }).join('') || '<div class="muted small">Ninguém selecionado ainda.</div>';
  cvConta();
}
function cvTodosVer() { S.cvAll = !S.cvAll; $('cvq').value = ''; cvLista(); }
function cvToggle(id) { if (S.cvSel[id]) delete S.cvSel[id]; else S.cvSel[id] = 1; cvLista(); }
function cvMsg() { var x = ($('cvt').value || '').trim(); return cvTextoPadrao(S.cv.prova) + (x ? '\n\n' + x : ''); }
function cvZap(id) {
  var a = cvAtl(id); if (!a) return;
  var t = cvMsg(), link = S.cv.prova.link;
  var msg = 'Olá, ' + String(a.nome).split(' ')[0] + '! ' + t + (t.indexOf(link) < 0 ? '\n\nFormulário de inscrição: ' + link : '');
  window.open('https://wa.me/' + cvFone(a.telefone) + '?text=' + encodeURIComponent(msg), '_blank');
}
function cvComEmail() { return Object.keys(S.cvSel).filter(function (id) { var a = cvAtl(id); return a && a.email; }); }
function cvConta() {
  var com = cvComEmail(), tot = Object.keys(S.cvSel).length, b = $('cvb');
  var nomes = function (l) { return l.map(function (id) { var a = cvAtl(id); return a ? esc(a.nome) : ''; }).join(', '); };
  var sem = Object.keys(S.cvSel).filter(function (id) { return com.indexOf(id) < 0; });
  if ($('cvpara')) {
    $('cvpara').textContent = tot ? 'O e-mail vai para (' + com.length + ')' : 'Nenhum atleta selecionado';
    $('cvparal').innerHTML = (com.length ? nomes(com) : (tot ? '' : 'Busque e toque nos nomes acima para selecionar.')) +
      (sem.length ? '<div class="muted" style="margin-top:6px">Sem e-mail (use o ícone do WhatsApp): ' + nomes(sem) + '</div>' : '');
  }
  if (b) { b.textContent = com.length ? 'Enviar e-mail para ' + com.length + (com.length === 1 ? ' atleta' : ' atletas') : (tot ? 'Os selecionados não têm e-mail' : 'Selecione atletas para enviar'); b.disabled = !com.length; }
}
function cvEnvia() {
  var ids = cvComEmail(), texto = cvMsg(), sem = Object.keys(S.cvSel).length - ids.length;
  if (!ids.length) return;
  dlg('Enviar este e-mail para ' + ids.length + (ids.length === 1 ? ' atleta' : ' atletas') + '?' + (sem ? ' (' + sem + ' sem e-mail não recebe.)' : '') + ' O envio não pode ser desfeito.', { ok: 'Enviar' }).then(function (v) {
    if (!v) return;
    $('cvb').disabled = true; $('cvb').textContent = 'Enviando…';
    call('conviteEnviar', { id: S.cv.prova.id, ids: ids, texto: texto }).then(function (r) {
      aviso(r.enviados + ' e-mails enviados.' + (r.falhas.length ? ' Falhou para: ' + r.falhas.join(', ') + '.' : '')).then(function () { convidar(S.cv.prova.id); });
    }).catch(function (e) { aviso(e.message); cvConta(); });
  });
}

function verPainel() { S.aba2 = 'pnl'; painel('hist'); }

function painel(aba) {
  S.aba = aba; S.aba2 = 'pnl';
  if (aba === 'eng') { painelEng(); return; }
  if (aba === 'pres') { painelPres(); return; }
  var tabs = painelTabs(aba);
  if (aba === 'prof') {
    app(head(userBar()) + '<button class="back" onclick="inicio()">← Mensagens</button><div><div class="eyebrow">Head coach</div><h2>Painel</h2></div>' + tabs + '<div class="spin">Carregando…</div>');
    call('professores').then(function (r) {
      app(head(userBar()) + '<button class="back" onclick="inicio()">← Mensagens</button><div><div class="eyebrow">Head coach</div><h2>Painel</h2></div>' + tabs +
        '<div class="list">' + r.lista.map(function (p) {
          return '<div class="card"><div class="row" style="justify-content:space-between;align-items:center"><h3>' + esc(p.nome) + '</h3>' + (p.ativo ? '<span class="tag g">Ativo</span>' : '<span class="tag w">Desativado</span>') + '</div>' +
            '<div class="small muted">' + esc(p.email) + ' · ' + esc(p.perfil) + '</div>' +
            '<div class="small muted">Último acesso: ' + (esc(p.acesso) || 'nunca') + (p.trocar ? ' · aguardando troca de senha' : '') + '</div>' +
            '<div class="row"><button class="btn btn-sm" onclick="ativaProf(\'' + esc(p.email) + '\',' + (!p.ativo) + ')">' + (p.ativo ? 'Desativar' : 'Reativar') + '</button>' +
            '<button class="btn btn-sm btn-line" onclick="resetProf(\'' + esc(p.email) + '\')">Resetar senha</button></div></div>';
        }).join('') + '</div>' +
        '<form class="card hot" id="np"><div class="eyebrow">Novo professor</div><div id="nm"></div><div><label for="pn">Nome</label><input id="pn" type="text"></div><div><label for="pe">E-mail</label><input id="pe" type="email"></div>' +
        '<button class="btn btn-green" type="submit">Cadastrar</button><p class="small muted">Senha inicial: 123456. No primeiro acesso o professor cria a própria senha.</p></form>');
      $('np').onsubmit = function (e) {
        e.preventDefault();
        call('novoProfessor', { nome: $('pn').value, email: $('pe').value }).then(function () { painel('prof'); }).catch(function (er) { $('nm').innerHTML = '<div class="err">' + esc(er.message) + '</div>'; });
      };
    }).catch(function (e) { aviso(e.message); });
    return;
  }
  app(head(userBar()) + '<button class="back" onclick="inicio()">← Mensagens</button><div><div class="eyebrow">Head coach</div><h2>Painel</h2></div>' + tabs +
    '<form class="card" id="fh"><div><label for="hp">Professor (e-mail)</label><input id="hp" type="text" placeholder="todos"></div>' +
    '<div><label for="ha">Atleta</label><input id="ha" type="text" placeholder="todos"></div>' +
    '<div class="row"><div style="flex:1;min-width:130px"><label for="hd">De</label><input id="hd" type="date"></div><div style="flex:1;min-width:130px"><label for="hu">Até</label><input id="hu" type="date"></div></div>' +
    '<label class="chk" style="margin:0"><input type="checkbox" id="hx"><span class="small">Só prioridades</span></label>' +
    '<button class="btn btn-green" type="submit">Filtrar</button></form><div id="hr"><div class="spin">Carregando…</div></div>');
  $('fh').onsubmit = function (e) { e.preventDefault(); carregaHist(); };
  carregaHist();
}
function carregaHist() {
  $('hr').innerHTML = '<div class="spin">Carregando…</div>';
  call('historico', { professor: $('hp').value.trim(), atleta: $('ha').value.trim(), de: $('hd').value, ate: $('hu').value, soPrioridade: $('hx').checked }).then(function (r) {
    $('hr').innerHTML = '<div class="card"><div class="eyebrow">' + r.total + ' registro(s)' + (r.total > 300 ? ' · mostrando os 300 mais recentes' : '') + '</div>' +
      (r.itens.length ? r.itens.map(function (h) { return histItem(h, true); }).join('') : '<div class="muted small">Nada encontrado.</div>') + '</div>';
  }).catch(function (e) { $('hr').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
}
function ativaProf(email, ativo) { call('ativarProfessor', { email: email, ativo: ativo }).then(function () { painel('prof'); }).catch(function (e) { aviso(e.message); }); }
function resetProf(email) {
  dlg('Resetar a senha deste professor para 123456? Ele terá de criar uma nova no próximo acesso.', { ok: 'Resetar' }).then(function (sim) {
    if (!sim) return;
    call('resetarSenha', { email: email }).then(function () { painel('prof'); return aviso('Senha resetada para 123456.'); }).catch(function (e) { aviso(e.message); });
  });
}

document.addEventListener('visibilitychange', function () {
  if (document.visibilityState !== 'visible' || !S.token) return;
  call('abriu').catch(function () {});
  if (S.telaMural) carregaMural(false);
});
if (S.token) { call('abriu').catch(function () {}); inicio(); } else telaLogin();
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
</script>
</body>
</html>
