<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="BLC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>BLC · Professores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--panel:rgba(255,255,255,.035);--panel-2:rgba(255,255,255,.06);--line:rgba(255,255,255,.14);--fg:#fff;--text:rgba(255,255,255,.78);--muted:rgba(255,255,255,.58);--green:#00ff00;--cyan:#00ffff;--font:'Montserrat','Segoe UI',system-ui,-apple-system,Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(ellipse 80% 40% at 85% 0%,rgba(0,255,0,.10),transparent 70%),radial-gradient(ellipse 60% 30% at 0% 55%,rgba(0,255,255,.05),transparent 70%);background-repeat:no-repeat;color:var(--text);font-family:var(--font);font-weight:300;font-size:15px;line-height:1.65;letter-spacing:.02em;padding:0 18px 110px}
.wrap{max-width:640px;margin:0 auto;padding-top:22px;display:flex;flex-direction:column;gap:30px}
h1,h2,h3,h4{font-family:var(--font);text-transform:uppercase;margin:0;color:var(--fg);overflow-wrap:anywhere}
h1{font-weight:200;font-size:clamp(1.5rem,7vw,2.4rem);line-height:1.2;letter-spacing:.1em}
h2{font-weight:200;font-size:clamp(1.25rem,5.6vw,1.7rem);line-height:1.25;letter-spacing:.1em}
h2 em{font-style:normal;font-weight:300;color:var(--green)}
h3{font-weight:300;font-size:1.05rem;letter-spacing:.12em}
p{margin:0}
.eyebrow{font-weight:500;text-transform:uppercase;letter-spacing:.24em;font-size:.68rem;color:var(--green)}
.eyebrow.cy{color:var(--cyan)}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.brand{display:flex;align-items:center;gap:12px}
.mark{display:flex;flex-direction:column;gap:5px;width:26px}
.mark i{display:block;height:2px}.mark i:nth-child(1){background:var(--cyan)}.mark i:nth-child(2){background:var(--green)}.mark i:nth-child(3){background:#fff}
.brand b{font-weight:200;font-size:1.7rem;letter-spacing:.32em;color:var(--fg);line-height:1}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ld{position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center}
.ld .lg{position:relative;display:flex;align-items:center;gap:16px}
.ld .lg.base{opacity:.16}
.ld .lg.fill{position:absolute;inset:0;animation:ldsobe 2.4s ease-in-out infinite}
.ld .mark{width:46px;gap:9px}.ld .mark i{height:4px}
.ld .lg b{font-weight:200;font-size:2.6rem;letter-spacing:.32em;color:var(--fg);line-height:1}
@keyframes ldsobe{0%{clip-path:inset(100% 0 0 0)}80%,100%{clip-path:inset(0 0 0 0)}}
.ld p{margin:0;font-size:.8rem;text-transform:uppercase;letter-spacing:.16em;color:var(--text);min-height:1em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--font);font-weight:400;font-size:.74rem;text-transform:uppercase;letter-spacing:.16em;text-decoration:none;padding:14px 22px;border-radius:0;background:transparent;color:var(--fg);border:1px solid rgba(255,255,255,.28);cursor:pointer;line-height:1.3;text-align:center}
.btn:hover{border-color:var(--green);color:var(--green)}
.btn-green{background:var(--green);color:#000;border-color:var(--green);font-weight:600;box-shadow:0 0 28px rgba(0,255,0,.25)}
.btn-green:hover{background:#33ff33;color:#000;border-color:#33ff33}
.btn-line{border-color:var(--green);color:var(--green)}
.btn-sm{padding:9px 14px;font-size:.64rem}
.btn[disabled]{opacity:.5;cursor:default}
.card{border:1px solid var(--line);background:var(--panel);padding:18px 18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.hot{border-color:var(--green);box-shadow:0 0 24px rgba(0,255,0,.10)}
.card.cy{border-color:var(--cyan)}
label{font-weight:500;text-transform:uppercase;letter-spacing:.16em;font-size:.66rem;color:var(--cyan);display:block;margin-bottom:6px}
input[type=text],input[type=email],input[type=password],input[type=search],input[type=date],select,textarea{width:100%;font-family:var(--font);font-weight:300;font-size:16px;letter-spacing:.02em;color:var(--fg);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.22);border-radius:0;padding:13px 14px;outline:none}
textarea{min-height:120px;resize:vertical;line-height:1.55}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--green) 50%),linear-gradient(135deg,var(--green) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px;background-repeat:no-repeat}
select option{background:#111;color:#fff}
input:focus,select:focus,textarea:focus{border-color:var(--cyan)}
.chk{display:flex;gap:12px;align-items:flex-start;border:1px dashed rgba(255,255,255,.28);padding:12px 14px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:#00ff00;margin-top:2px;flex:none}
.chk.on{border-color:var(--cyan);background:rgba(0,255,255,.06)}
.chk b{font-weight:500;color:var(--fg);text-transform:uppercase;letter-spacing:.1em;font-size:.76rem;display:block}
.err{border:1px solid #ff5a5a;color:#ffb3b3;padding:10px 14px;font-size:.85rem}
.ok{border:1px solid var(--green);color:var(--green);padding:10px 14px;font-size:.85rem}
.list{display:flex;flex-direction:column;gap:8px}
.pick{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);color:var(--fg);font-family:var(--font);font-size:.92rem;font-weight:300;padding:14px 16px;cursor:pointer;letter-spacing:.04em}
.pick:hover{border-color:var(--green)}
.pick span.a{color:var(--green)}
.tag{display:inline-block;font-weight:500;text-transform:uppercase;letter-spacing:.16em;font-size:.58rem;padding:3px 8px;border:1px solid var(--cyan);color:var(--cyan);white-space:nowrap}
.tag.g{border-color:var(--green);color:var(--green)}
.tag.w{border-color:#fff;color:#fff}
.kv{display:grid;grid-template-columns:1fr;gap:10px}
.kv div{min-width:0}
.kv small{display:block;font-weight:500;text-transform:uppercase;letter-spacing:.16em;font-size:.6rem;color:var(--cyan);margin-bottom:1px}
.kv span{color:var(--fg);overflow-wrap:anywhere;white-space:pre-wrap}
.kv span.none{color:rgba(255,255,255,.35)}
@media(min-width:520px){.kv.two{grid-template-columns:1fr 1fr}}
.row{display:flex;gap:10px;flex-wrap:wrap}
.hist{border-left:2px solid var(--line);padding:2px 0 2px 14px;display:flex;flex-direction:column;gap:6px}
.hist.pri{border-left-color:var(--cyan)}
.hist .meta{font-size:.74rem;color:var(--muted);letter-spacing:.06em}
.hist .txt{color:var(--fg);white-space:pre-wrap;overflow-wrap:anywhere}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{flex:1;min-width:110px}
.tabs .on{border-color:var(--green);color:var(--green)}
.back{background:none;border:0;color:var(--muted);font-family:var(--font);font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;padding:0;text-align:left}
.back:hover{color:var(--green)}
.spin{color:var(--muted);text-align:center;padding:30px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}
.dlg{background:#050505;border:1px solid var(--green);box-shadow:0 0 36px rgba(0,255,0,.18);max-width:420px;width:100%;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.dlg p{color:var(--fg);white-space:pre-line}
.msg{border-left:2px solid var(--line);padding:2px 0 8px 12px;display:flex;flex-direction:column;gap:5px}
.msg.mine{border-left-color:var(--green)}
.msg.pri{border-left-color:var(--cyan)}
.msg .meta{font-size:.74rem;color:var(--muted);letter-spacing:.05em}
.msg .txt{color:var(--fg);white-space:pre-wrap;overflow-wrap:anywhere}
.quote{border-left:2px solid var(--cyan);padding:2px 0 2px 10px;font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.chip{font-family:var(--font);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;background:transparent;color:var(--fg);border:1px solid rgba(255,255,255,.28);padding:8px 12px;cursor:pointer}
.chip.on{border-color:var(--green);color:var(--green);background:rgba(0,255,0,.07)}
.chk .small{display:block;text-transform:none;letter-spacing:.02em;font-weight:300}
.lnk{background:none;border:0;padding:4px 0;color:var(--cyan);font-family:var(--font);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.bar{height:6px;background:rgba(255,255,255,.1)}.bar i{display:block;height:100%;background:var(--green)}
#nav{position:fixed;left:0;right:0;bottom:0;display:none;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(0,0,0,.96);border-top:1px solid var(--line);z-index:40}
#nav>div{max-width:640px;margin:0 auto;display:flex;gap:8px}
#nav .btn{flex:1 1 0;min-width:0;padding:11px 6px;font-size:.6rem;letter-spacing:.12em;line-height:1.25;min-height:44px}
#nav .btn.nv-new{flex:1.4 1 0}
#nav .btn.on{border-color:var(--green);color:var(--green)}
@media(max-width:400px){#nav .btn{font-size:.54rem;letter-spacing:.07em;padding:10px 3px}}
.thread{display:flex;flex-direction:column;gap:8px}.replies{display:flex;flex-direction:column;gap:8px;margin-left:14px;padding-left:12px;border-left:2px solid var(--green)}.replies .card{padding:12px}.more{align-self:flex-start}
.rp{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ciente{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;padding:11px 14px;min-height:44px;border:1.5px solid var(--green);background:transparent;color:var(--green);font-family:var(--font);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.ciente.ok{background:var(--green);color:#000;border-color:var(--green);cursor:default}
.vis{font-size:.74rem;color:var(--muted);letter-spacing:.04em}
footer{text-align:center;color:var(--muted);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;padding-top:10px}

.brandbtn{background:none;border:0;padding:6px 0;cursor:pointer;color:inherit;font:inherit;text-align:left}
.brandbtn:focus-visible{outline:2px solid var(--cyan);outline-offset:4px}
.drw{position:fixed;inset:0;z-index:60}
.dbg{position:absolute;inset:0;background:rgba(0,0,0,.65)}
.dpn{position:absolute;top:0;bottom:0;left:0;width:min(82vw,320px);background:#000;border-right:1px solid var(--line);padding:22px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;overflow-y:auto;animation:dsl .18s ease-out}
@keyframes dsl{from{transform:translateX(-100%)}to{transform:none}}
.dit{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:1px solid var(--line);color:var(--fg);font-family:var(--font);font-weight:300;font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;padding:14px 14px;cursor:pointer;min-height:48px}
.dit.on{border-color:var(--green);color:var(--green)}
.dsec{font-weight:500;text-transform:uppercase;letter-spacing:.22em;font-size:.6rem;color:var(--muted);margin-top:10px}
.dpn .dtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.tag.r{border-color:#ff5a5a;color:#ffb3b3}
.insrow{display:flex;flex-direction:column;gap:8px}
.cvr{padding:10px 12px;gap:10px;align-items:center;justify-content:space-between}.cvr>span{flex:1;min-width:0;cursor:pointer}.cvr b{font-size:.72rem;letter-spacing:.06em;line-height:1.35;overflow-wrap:anywhere}.cvr .small{display:block;font-size:.72rem;overflow-wrap:anywhere}.zap{flex:none;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:1px solid var(--green);background:transparent;color:var(--green);padding:0;cursor:pointer}.zap:hover{background:var(--green);color:#000}
/* ---------- presença de alunos ---------- */
.pa{display:flex;flex-direction:column;gap:16px;min-width:0}
.pa-tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.pa-tot div{border:1px solid var(--line);background:var(--panel);padding:10px 14px;min-width:0}
.pa-tot b{display:block;font-size:1.6rem;font-weight:800;color:var(--green);font-variant-numeric:tabular-nums}
.pa-tot span{font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pa-tot .all b{color:var(--fg)}
.pa-mode{display:flex;gap:0;flex-wrap:wrap}
.pa-mode button{font-family:var(--font);font-weight:600;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:10px 16px;cursor:pointer;flex:1}
.pa-mode button.on{background:var(--green);color:#000;border-color:var(--green)}
.pa-tabs{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px}.pa-tabs button{flex:none}
.pa-tabs button{font-family:var(--font);font-weight:600;font-size:.7rem;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:8px 12px;cursor:pointer;text-align:left;line-height:1.4}
.pa-tabs button small{display:block;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.pa-tabs button.on{border-color:var(--green);box-shadow:inset 0 -3px 0 var(--green)}
.pa-wrap{overflow-x:auto;border:1px solid var(--line);background:var(--panel)}
.pa-wrap table{border-collapse:collapse;width:100%;min-width:620px}
.pa-wrap th,.pa-wrap td{border-bottom:1px solid var(--line);padding:9px 6px;text-align:center;font-variant-numeric:tabular-nums}
.pa-wrap th{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pa-wrap th small{display:block;font-weight:400;letter-spacing:0}
.pa-wrap th.l,.pa-wrap td.l{text-align:left;padding-left:12px}
.pa-wrap td.l{font-weight:600;font-size:.78rem}
.pa-wrap td.l small{display:block;color:var(--muted);font-size:.64rem;margin-top:2px;font-weight:400}
.pa-wrap tr.sum td{font-weight:800;border-bottom:0;background:rgba(255,255,255,.05)}
.pa-wrap .off{background:rgba(255,255,255,.05);color:var(--muted);font-size:.62rem}
.pa-wrap td.tt{border-left:2px solid var(--line)}
button.pa-n{font-family:var(--font);font-weight:800;font-size:1.05rem;min-width:42px;height:36px;padding:0 6px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;position:relative}
button.pa-n:hover{border-color:var(--green)}
button.pa-n.on{background:var(--green);color:#000;border-color:var(--green)}
button.pa-n.z{color:var(--muted);font-weight:400}
button.pa-n i{position:absolute;top:-6px;right:-6px;background:#ffb347;color:#000;font:800 .6rem var(--font);width:14px;height:14px;line-height:14px;border-radius:50%;font-style:normal}
.pa-panel{border:1px solid var(--line);background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:12px;min-height:80px;min-width:0}
.pa-panel h3{margin:0;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase}
.pa-panel h3 em{font-style:normal;color:var(--green)}
.pa-names{display:flex;flex-wrap:wrap;gap:6px}
.pa-names span{border:1px solid var(--line);padding:5px 10px;font-size:.78rem}
.pa-names span b{color:var(--green);margin-left:6px}
.pa-pass{color:#ffb347;font-size:.74rem;line-height:1.6}
.pa-pass b{letter-spacing:.08em;text-transform:uppercase;font-size:.66rem}
.pa-hint{color:var(--muted);font-size:.78rem}
.pa-rank{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 18px;font-size:.78rem;margin-top:8px}
.pa-rank div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:4px 0}
.pa-rank b{color:var(--green)}
.pa-hs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.pa-hc{border:1px solid var(--line);background:var(--panel);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pa-hc h4{margin:0;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase}
.pa-hc small{color:var(--muted);font-size:.66rem}
.pa-hc .tr{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:.72rem}
.pa-hc .tr b{font-size:.95rem}
.pa-up{color:var(--green)}.pa-dn{color:#ffb347}
svg.pa-ch{width:100%;height:auto;display:block}
svg.pa-ch rect.b{fill:var(--green);cursor:pointer}
svg.pa-ch rect.b.part{opacity:.4}
svg.pa-ch rect.b.sel{fill:var(--cyan)}
svg.pa-ch text{fill:var(--muted);font:9px var(--font)}
svg.pa-ch text.v{fill:var(--fg)}
svg.pa-ch line{stroke:var(--line)}
.pa-sw{display:flex;gap:0;margin-top:4px}
.pa-al{border:1px solid var(--line);background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pa-al.red{border-color:#ff5a5a}.pa-al.yel{border-color:#ffb347}
.pa-al .ttl{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.pa-al .ttl b{font-size:.88rem}
.pa-al .msg{border-left:2px solid var(--line);padding:4px 0 4px 12px;color:var(--text);font-size:.78rem;white-space:pre-wrap}
.pa-al .row{display:flex;gap:8px;flex-wrap:wrap}
.pa [hidden]{display:none!important}
</style>
</head>

<div class="wrap" id="app"><div class="spin">Carregando…</div></div>
<div id="nav"></div>
<script>
var S = { token: null, nome: '', perfil: '', email: '', atletas: [], alertas: [], tipos: [], todos: false, aba2: 'msg', fix: {}, vi: {}, limite: 40, troca: false, telaMural: false };
var API_URL = 'https://script.google.com/macros/s/AKfycbxOuRyzjdQlgKXVNYe5nawePStDPTUTBtOr4p2gD69tuUmZq8lct15tpcwomj8dAZctcw/exec';
try { var t0 = localStorage.getItem('blc_t'); if (t0) { S.token = t0; S.nome = localStorage.getItem('blc_n') || ''; S.perfil = localStorage.getItem('blc_p') || ''; S.email = localStorage.getItem('blc_e') || ''; } } catch (e) {}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function $(id) { return document.getElementById(id); }
var timers = [];
function pararTimers() { timers.forEach(clearInterval); timers = []; }
function app(html, semNav) { pararTimers(); S.telaMural = false; S.rp = null; $('app').innerHTML = html; window.scrollTo(0, 0); desenhaNav(!semNav && !!S.token && !S.troca); }
function desenhaNav(on) {
  var n = $('nav'); if (n) n.style.display = 'none';
  if (on && S.provas === undefined && !S.provasCarregando) carregaProvas();
}
/* ---------- avisos no celular (push) e numero no icone ---------- */
var FB = { config: null, vapid: '' };   /* preenchido com os dados publicos do projeto Firebase */
function pushPronto() { return !!(FB.config && FB.vapid && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window); }
function carregaScript(src) { return new Promise(function (res, rej) { var s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
function pushToken() {
  return carregaScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js')
    .then(function () { return carregaScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js'); })
    .then(function () { if (!firebase.apps.length) firebase.initializeApp(FB.config); return navigator.serviceWorker.ready; })
    .then(function (reg) { return firebase.messaging().getToken({ vapidKey: FB.vapid, serviceWorkerRegistration: reg }); });
}
function pushAtiva() {
  if (!pushPronto()) { aviso('Os avisos ainda n\u00e3o est\u00e3o dispon\u00edveis neste aparelho. No iPhone, instale o app na tela inicial (iOS 16.4 ou mais novo).'); return; }

/* ---------- conversas: a mensagem raiz e as respostas agrupadas ---------- */
function fios(lista) {
  var por = {}, ordem = [], idx = {};
  lista.forEach(function (m) { idx[m.id] = m; });
  function raizDe(m) {
    var n = 0;
    while (n++ < 30 && m.resposta && idx[m.resposta.id]) m = idx[m.resposta.id];
    return m.id;
  }
  lista.forEach(function (m) {
    var k = raizDe(m);
    if (!por[k]) { por[k] = { id: k, itens: [] }; ordem.push(por[k]); }
    por[k].itens.push(m);
  });
  ordem.forEach(function (t) {
    t.itens.sort(function (a, b) { return a.ts - b.ts; });
    var r = null;
    t.itens.forEach(function (m) { if (m.id === t.id) r = m; });
    t.raiz = r || t.itens[0];
    t.filhos = t.itens.filter(function (m) { return m !== t.raiz; });
    t.ts = t.itens[t.itens.length - 1].ts;
  });
  ordem.sort(function (a, b) { return b.ts - a.ts; });
  return ordem;
}
function fioHtml(t, hotFn, opts) {
  opts = opts || {};

    vis = f.filter(function (m, i) { return i >= f.length - 3 || (m.paraMim && !S.fix[m.id]); });
    escondidas = f.length - vis.length;
  }
  var fo = { semAtleta: true, filha: true };
  return '<div class="thread">' + topo + '<div class="replies">' +
    (escondidas ? '<button class="btn btn-sm more" onclick="fioAbre(\'' + esc(t.id) + '\')">Ver todas as ' + f.length + ' respostas</button>' : '') +
    (S.abertos[t.id] && f.length > 3 ? '<button class="btn btn-sm more" onclick="fioAbre(\'' + esc(t.id) + '\')">Mostrar só as 3 últimas</button>' : '') +
    vis.map(function (m) { return muralCard(m, hotFn(m), fo); }).join('') + '</div></div>';
}

/* @atleta: digitar @ numa caixa de texto abre a lista de atletas; quem for escolhido é marcado na mensagem e ela vai para a ficha dele */
function ligaArroba(taId) {
  var ta = $(taId); if (!ta || ta._arr) return;
  ta._arr = {};
  var box = document.createElement('div'); box.className = 'list'; box.style.marginTop = '6px';
  ta.parentNode.insertBefore(box, ta.nextSibling);
  var dica = document.createElement('div'); dica.className = 'small muted'; dica.style.marginTop = '4px';
  dica.textContent = 'Digite @ e o nome para marcar um atleta: a mensagem também aparece na ficha dele.';
  ta.parentNode.insertBefore(dica, box);
  function garante() {
    if (S.atletasTodos) return Promise.resolve();
    return call('inicio', { todos: true }).then(function (r) { S.atletasTodos = r.atletas; S.tipos = r.tipos; });
  }
  function atualiza() {
    var antes = ta.value.slice(0, ta.selectionStart || 0);
    var m = /(^|\s)@([^\s@]*)$/.exec(antes);
    if (!m) { box.innerHTML = ''; return; }
    var q = norm(m[2]);
    garante().then(function () {
      var lista = (S.atletasTodos || []).filter(function (a) { return !q || norm(a.nome).indexOf(q) >= 0; }).slice(0, 6);
      box.innerHTML = lista.map(function (a) {
        return '<button type="button" class="pick" data-a="' + esc(a.id) + '"><span>' + esc(a.nome) + '</span><span>' + (a.status === 'Inativo' ? '<span class="tag w">Inativo</span> ' : '') + '<span class="a">@</span></span></button>';
      }).join('') || '<div class="muted small">Nenhum atleta encontrado.</div>';
      Array.prototype.forEach.call(box.querySelectorAll('.pick'), function (b) {
        b.onclick = function () {
          var id = b.getAttribute('data-a');
          var at = (S.atletasTodos || []).filter(function (x) { return x.id === id; })[0]; if (!at) return;
          var pos = ta.selectionStart || 0;
          var ini = ta.value.slice(0, pos).replace(/@[^\s@]*$/, '');
          var fim = ta.value.slice(pos);
          ta.value = ini + '@' + at.nome + ' ' + fim;
          ta._arr[id] = at.nome;
          var novo = (ini + '@' + at.nome + ' ').length;
          box.innerHTML = ''; ta.focus(); try { ta.setSelectionRange(novo, novo); } catch (e) {}
        };
      });
    }).catch(function () { box.innerHTML = ''; });
  }
  ta.addEventListener('input', atualiza);
  ta.addEventListener('click', atualiza);
  ta.addEventListener('keyup', function (e) { if (e.key && e.key.indexOf('Arrow') === 0) atualiza(); });
}
function idsArroba(taId) {
  var ta = $(taId); if (!ta || !ta._arr) return [];
  return Object.keys(ta._arr).filter(function (id) { return ta.value.indexOf('@' + ta._arr[id]) >= 0; });
}
function uniao(a, b) { var o = a.slice(); b.forEach(function (x) { if (o.indexOf(x) < 0) o.push(x); }); return o; }

function cienteBtn(m) {

function ciente(id) {
  if (S.vi[id]) return;
  var b = $('ci_' + id);
  S.vi[id] = 1; S.fix[id] = 1;
  var it = (S.lookup || {})[id];
  if (it && it.paraMim && S.mural) S.mural.paraMimTotal = Math.max(0, S.mural.paraMimTotal - 1);
  if (b) { b.className = 'ciente ok'; b.disabled = true; b.removeAttribute('onclick'); b.setAttribute('aria-pressed', 'true'); b.querySelector('span').textContent = 'Ciente · você leu'; }
  desenhaNav(true);
  call('muralVisto', { ids: [id] }).catch(function () {

    aviso('Não consegui registrar. Confira a internet e toque de novo.');

/* "Visto": a mensagem em que o professor foi marcado conta como vista quando aparece na tela dele */
function observaVistos() {
  return; // agora o professor confirma a ciência com o botão "Li e estou ciente"
  var els = Array.prototype.filter.call(document.querySelectorAll('[data-need="1"]'), function (e) { return !S.vi[e.getAttribute('data-id')]; });
  if (!els.length) return;
  var pend = {}, tm = null;
  function envia() {
    var ids = Object.keys(pend); pend = {}; tm = null;
    if (ids.length) call('muralVisto', { ids: ids }).catch(function () {});
  }
  function marca(id) {
    if (S.vi[id]) return;
    S.vi[id] = 1; pend[id] = 1;
    var it = (S.lookup || {})[id];
    if (it && it.paraMim) {
      S.fix[id] = 1;
      if (S.mural) S.mural.paraMimTotal = Math.max(0, S.mural.paraMimTotal - 1);
    }
    desenhaNav(true);
    if (!tm) tm = setTimeout(envia, 1200);
  }
  if (!('IntersectionObserver' in window)) { els.forEach(function (e) { marca(e.getAttribute('data-id')); }); return; }
  var io = new IntersectionObserver(function (es) {
    es.forEach(function (en) {
      if (en.isIntersecting && document.visibilityState === 'visible') { io.unobserve(en.target); marca(en.target.getAttribute('data-id')); }
    });
  }, { threshold: 0.25 });
  els.forEach(function (e) { io.observe(e); });
}

/* ---------- presença dos professores (só head coach) ---------- */
function dataBr(iso) { var p = String(iso).split('-'); return p[2] + '/' + p[1]; }
/* Índice de envolvimento: pesos e metas (a soma dos pesos é 100). Ajuste aqui se quiser mudar a conta. */
var PESO = { comp: 30, pont: 30, leit: 10, esc: 20, acc: 20 };
var META_ESC_SEMANA = 2;   // mensagens/registros escritos por semana = 100% de escrita
var META_ACESSO_SEMANA = 3; // abrir o app em pelo menos 3 dias por semana = 100% de acesso
var BANDAS = [[80, 'Muito bom', 'g'], [60, 'Bom', 'g'], [40, 'Precisa melhorar', ''], [0, 'Atenção', 'w']];
var PV = { de: '', ate: '', sel: null, d: null, envs: [] };
function lim01(x) { return Math.max(0, Math.min(1, x)); }
function banda(n) { for (var i = 0; i < BANDAS.length; i++) if (n >= BANDAS[i][0]) return BANDAS[i]; return BANDAS[3]; }
function indiceEnv(pr, ev, dias) {
  var c = [];
  if (pr && pr.previstos) {
    c.push({ k: 'Comparecimento', p: PESO.comp, v: pr.registrados / pr.previstos });
    c.push({ k: 'Pontualidade', p: PESO.pont, v: pr.registrados ? pr.no_horario / pr.registrados : null });
  }
  c.push({ k: 'Leitura', p: PESO.leit, v: ev.devidas ? ev.vistas / ev.devidas : null });
  c.push({ k: 'Escrita', p: PESO.esc, v: lim01(ev.escritas / (META_ESC_SEMANA * dias / 7)) });
  c.push({ k: 'Acesso ao app', p: PESO.acc, v: lim01(ev.diasAbriu / (META_ACESSO_SEMANA * dias / 7)) });
  var soma = 0, tot = 0;
  c.forEach(function (x) { if (x.v !== null) { soma += x.p * x.v; tot += x.p; } });
  return { nota: tot ? Math.round(100 * soma / tot) : null, comp: c, tot: tot };
}
/* Recalcula a presença do professor só com os dias do período escolhido. Atraso = minutos que passaram da tolerância. */
function atrasoEf(x, ref) { return x.atraso; }
function limHora(ref, tol) { var b = ref.split(':'), t = +b[0] * 60 + +b[1] + tol; return ('0' + Math.floor(t / 60)).slice(-2) + ':' + ('0' + (t % 60)).slice(-2); }
function presPeriodo(pr) {
  var out = { previstos: 0, registrados: 0, no_horario: 0, exc: 0, locais: [] };
  pr.locais.forEach(function (l) {
    var tol = l.tol_min || PV.d.tolerancia_min;
    var dias = l.dias.filter(function (x) { return x.data >= PV.de && x.data <= PV.ate; });
    var reg = dias.filter(function (x) { return !x.sem_dado; });
    var nh = reg.filter(function (x) { return atrasoEf(x, l.ref) <= tol; }).length;
    var exc = reg.reduce(function (a, x) { return a + Math.max(0, atrasoEf(x, l.ref) - tol); }, 0);
    var at = reg.reduce(function (a, x) { return a + x.ativo; }, 0);
    out.locais.push({ l: l, tol: tol, dias: dias, previstos: dias.length, registrados: reg.length, no_horario: nh, exc: exc, ativo: reg.length ? at / reg.length : null });
    out.previstos += dias.length; out.registrados += reg.length; out.no_horario += nh; out.exc += exc;
  });
  return out;
}
function feedbackEnv(ag, ev, dias, ix) {
  var c = {}, f = [];
  ix.comp.forEach(function (x) { c[x.k] = x.v; });
  function pc(v) { return Math.round(100 * v) + '%'; }
  function add(v, txt, ok, mel) { f.push(v >= 0.85 ? { s: 'bom', t: txt } : (v >= 0.6 ? { s: 'ok', t: txt + ok } : { s: 'mel', t: txt + mel })); }
  if (c['Comparecimento'] != null) add(c['Comparecimento'], 'Esteve em ' + ag.registrados + ' de ' + ag.previstos + ' treinos previstos (' + pc(c['Comparecimento']) + ').',
    ' Dá para chegar mais perto de 100%.', ' Se houve falta combinada ou problema com o relógio, vale conversar: o índice só enxerga o que o arquivo do treino registrou.');
  if (c['Pontualidade'] != null) {
    var atras = ag.registrados - ag.no_horario;
    add(c['Pontualidade'], 'Começou no horário em ' + ag.no_horario + ' de ' + ag.registrados + ' treinos (' + pc(c['Pontualidade']) + ').', '',
      (atras ? ' Quando atrasou, foi em média ' + Math.round(ag.exc / atras) + ' min além da tolerância.' : '') + ' Começar o treino até o limite de cada local resolve a maior parte.');
  }
  if (c['Leitura'] != null) add(c['Leitura'], 'Leu ' + ev.vistas + ' de ' + ev.devidas + ' mensagens da equipe (' + pc(c['Leitura']) + ').', ' Dá para melhorar.', ' Abrir o mural todo dia evita deixar prioridades paradas.');
  add(c['Escrita'], 'Escreveu ' + ev.escritas + ' registro(s); a meta do período é ' + Math.max(1, Math.round(META_ESC_SEMANA * dias / 7)) + '.', ' Dá para escrever um pouco mais.',
    ' Registrar o que observa nos treinos e nos atletas ajuda os colegas e o histórico.');
  add(c['Acesso ao app'], 'Abriu o app em ' + ev.diasAbriu + ' de ' + dias + ' dias (meta: ' + Math.max(1, Math.round(META_ACESSO_SEMANA * dias / 7)) + ', ou seja, ' + META_ACESSO_SEMANA + ' por semana).', ' Dá para abrir com mais frequência.',
    ' Abrir o app todo dia, antes ou depois do treino, mantém tudo em dia.');
  if (ev.medianaMin !== null && ev.medianaMin !== undefined) {
    if (ev.medianaMin <= 240) f.push({ s: 'bom', t: 'Costuma ver as mensagens em ' + minTxt(ev.medianaMin) + '.' });
    else if (ev.medianaMin > 1440) f.push({ s: 'mel', t: 'Costuma levar ' + minTxt(ev.medianaMin) + ' para ver uma mensagem; prioridades ficam esperando.' });
  }
  var melhor = null;
  ix.comp.forEach(function (x) { if (x.v !== null) { var g = 100 * x.p * (1 - x.v) / ix.tot; if (!melhor || g > melhor.g) melhor = { k: x.k, g: g }; } });
  var resumo = melhor && melhor.g >= 3 ? 'Onde mais ganha pontos: ' + melhor.k + ' (até +' + Math.round(melhor.g) + ' no índice).' : 'Sem ponto fraco relevante neste período.';
  return { itens: f, resumo: resumo };
}
function diasPeriodo() {
  var hoje = isoDia(new Date()), fim = PV.ate > hoje ? hoje : PV.ate;
  return Math.max(1, Math.round((new Date(fim + 'T00:00:00') - new Date(PV.de + 'T00:00:00')) / 86400000) + 1);

function chegueiEnvia() {

    call('cheguei', { lat: pos.coords.latitude, lng: pos.coords.longitude, precisao: pos.coords.accuracy }).then(function (r) {
      b.disabled = false;
      m.innerHTML = '<div class="card"><b>' + (r.dentro ? 'Chegada registrada' : 'Registrada como fora do local') + '</b><div class="small muted">' + esc(r.local) + ' \u00b7 ' + esc(r.quando) + (r.dentro ? '' : ' \u00b7 voc\u00ea est\u00e1 a ' + esc(r.distancia) + ' m') + '</div></div>';

  $('hr').innerHTML = '<div class="spin">Carregando…</div>';
  call('historico', { professor: $('hp').value.trim(), atleta: $('ha').value.trim(), de: $('hd').value, ate: $('hu').value, soPrioridade: $('hx').checked }).then(function (r) {
    $('hr').innerHTML = '<div class="card"><div class="eyebrow">' + r.total + ' registro(s)' + (r.total > 300 ? ' · mostrando os 300 mais recentes' : '') + '</div>' +
      (r.itens.length ? r.itens.map(function (h) { return histItem(h, true); }).join('') : '<div class="muted small">Nada encontrado.</div>') + '</div>';
  }).catch(function (e) { $('hr').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
}
function ativaProf(email, ativo) { call('ativarProfessor', { email: email, ativo: ativo }).then(function () { painel('prof'); }).catch(function (e) { aviso(e.message); }); }
function resetProf(email) {
  dlg('Resetar a senha deste professor para 123456? Ele terá de criar uma nova no próximo acesso.', { ok: 'Resetar' }).then(function (sim) {
    if (!sim) return;
    call('resetarSenha', { email: email }).then(function () { painel('prof'); return aviso('Senha resetada para 123456.'); }).catch(function (e) { aviso(e.message); });
  });
}

document.addEventListener('visibilitychange', function () {
  if (document.visibilityState !== 'visible' || !S.token) return;
  call('abriu').catch(function () {});
  if (S.telaMural) carregaMural(false);
});
if (S.token) { call('abriu').catch(function () {}); inicio(); } else telaLogin();
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
</script>
